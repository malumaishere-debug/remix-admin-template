<title>AI Fraud Prevention | SBR</title>

<style>
:root{--red:#C0392B;--red-l:#E74C3C;--blue:#2980B9;--gold:#D4AC0D;--bg0:#0c0c0c;--bg1:#111;--bg2:#1a1a1a;--border:rgba(255,255,255,.08);--text:#F7F7F7;--t2:#D2D2D2;--t3:#ADADAD;--t4:#808080;--fm:"IBM Plex Mono",monospace;--fd:"Bebas Neue",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:70px;scroll-behavior:smooth}
body{margin:0;padding-top:58px;background:var(--bg0);color:var(--text);font-family:"Lato",sans-serif;min-height:100vh;-webkit-text-size-adjust:100%}
a{color:var(--red-l)}
button{cursor:pointer;font-family:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.wrap-n{max-width:820px;margin:0 auto;padding:0 20px}
.js .rv{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
.js .rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.js .rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
.hero{padding:60px 0 26px;text-align:center}
.tag{font-family:var(--fm);font-size:10px;letter-spacing:4px;color:rgba(192,57,43,.85);text-transform:uppercase;margin:0 0 14px}
h1{font-family:var(--fd);font-size:clamp(32px,5.6vw,54px);line-height:1.05;letter-spacing:.5px;margin:0 0 16px;color:#fff}
h1 em{color:var(--red);font-style:normal}
.lede{color:var(--t2);font-size:17px;max-width:64ch;margin:0 auto 10px;line-height:1.6}
h2{font-family:var(--fd);font-size:clamp(24px,3.6vw,34px);color:#fff;margin:0 0 10px;letter-spacing:.4px}
h3{font-family:var(--fd);font-size:19px;color:#fff;margin:0 0 6px;letter-spacing:.3px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:26px 0 0;background:var(--bg1)}
.stats div{padding:16px 10px;border-right:1px solid var(--border);text-align:center}
.stats div:last-child{border-right:0}
.stats b{display:block;font-family:var(--fd);font-size:28px;color:var(--red);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.stats.rv b{transform:scale(.7);opacity:0}
.stats.rv.in b{transform:scale(1);opacity:1}
@media(prefers-reduced-motion:reduce){.stats.rv b,.stats.rv.in b{transform:none;opacity:1}}
.stats span{font-family:var(--fm);font-size:9px;letter-spacing:1.5px;color:var(--t4);text-transform:uppercase}
.sec{padding:54px 0 6px}
.sec + .sec{border-top:1px solid var(--border)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0 30px}
.tabs button{font-family:var(--fm);font-size:11px;letter-spacing:2px;text-transform:uppercase;padding:10px 18px;background:var(--bg1);border:1px solid var(--border);color:var(--t3)}
.tabs button.on{background:var(--red);border-color:var(--red);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.pcard{background:var(--bg1);border:1px solid var(--border);padding:22px;position:relative;transition:border-color .18s,transform .18s}
.pcard:hover{border-color:rgba(192,57,43,.35);transform:translateY(-2px)}
.pcard .dur{font-family:var(--fm);font-size:9.5px;letter-spacing:1.5px;color:var(--t4);text-transform:uppercase}
.pcard h3{margin:6px 0 8px}
.pcard p{color:var(--t3);font-size:14.5px;line-height:1.55;margin:0 0 16px;min-height:44px}
.pcard-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--border);padding-top:14px}
.price{font-family:var(--fd);font-size:26px;color:var(--gold);letter-spacing:.3px}
.price small{font-family:var(--fm);font-size:10px;color:var(--t4);text-transform:uppercase;margin-left:4px}
.addbtn{font-family:var(--fm);font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;padding:9px 14px;background:rgba(192,57,43,.12);border:1px solid rgba(192,57,43,.3);color:var(--red-l)}
.addbtn:hover{background:var(--red);color:#fff}
.addbtn.added{background:var(--red);color:#fff}
.addbtn.added::before{content:"\2713  "}
.note-flag{font-family:var(--fm);font-size:9px;color:var(--t4);letter-spacing:1px;margin-top:6px}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#0a0a0a;border-top:1px solid var(--border);transform:translateY(100%);transition:transform .3s ease;box-shadow:0 -12px 30px rgba(0,0,0,.4)}
.cartbar.show{transform:translateY(0)}
.cartbar .wrap{display:flex;align-items:center;gap:18px;padding:14px 20px;flex-wrap:wrap}
.cartbar .cnt{font-family:var(--fm);font-size:11px;color:var(--t3);letter-spacing:1px}
.cartbar .tot{font-family:var(--fd);font-size:24px;color:var(--gold);margin-left:auto}
.cartbar .cta{font-family:var(--fm);font-size:11.5px;letter-spacing:2px;text-transform:uppercase;padding:12px 20px;background:var(--red);color:#fff;text-decoration:none;white-space:nowrap}
.cartbar .cta:hover{background:var(--red-l)}
.cartbar .clear{font-family:var(--fm);font-size:10px;color:var(--t4);letter-spacing:1px;background:none;border:0;text-decoration:underline}
.faq details{border-top:1px solid var(--border);padding:16px 0}
.faq details:last-child{border-bottom:1px solid var(--border)}
.faq summary{cursor:pointer;font-family:var(--fd);font-size:18px;color:#fff;list-style:none;display:flex;justify-content:space-between;gap:16px;letter-spacing:.3px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--fm);color:var(--red)}
.faq details[open] summary::after{content:"\2212"}
.faq p{margin:10px 0 0;color:var(--t3);font-size:14.5px;max-width:70ch}
.foot{border-top:1px solid var(--border);padding:26px 0 90px;text-align:center;color:var(--t4);font-family:var(--fm);font-size:10px;letter-spacing:1.5px;text-transform:uppercase}
.article{padding:56px 0 40px}
.article .lede{margin:0 0 30px}
.article p{color:var(--t2);font-size:16.5px;line-height:1.75;margin:0 0 20px}
.article h2{margin-top:44px}
.pullquote{border-left:3px solid var(--red);padding:6px 0 6px 22px;margin:34px 0;font-family:var(--fd);font-size:24px;line-height:1.3;color:#fff;letter-spacing:.3px}
.callout{background:var(--bg1);border:1px solid var(--border);border-left:3px solid var(--gold);padding:20px 24px;margin:30px 0}
.callout b{display:block;font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:8px}
.callout p{margin:0;color:var(--t2);font-size:15px}
.numlist{counter-reset:n;margin:30px 0}
.numlist div{counter-increment:n;position:relative;padding:0 0 22px 46px;border-left:1px solid var(--border);margin-left:17px}
.numlist div:last-child{border-color:transparent}
.numlist div::before{content:counter(n);position:absolute;left:-17px;top:0;width:34px;height:34px;border-radius:50%;background:var(--bg1);border:1px solid var(--red);color:var(--red);font-family:var(--fd);font-size:16px;display:flex;align-items:center;justify-content:center}
.numlist b{display:block;color:#fff;font-family:var(--fd);font-size:18px;margin-bottom:4px;letter-spacing:.3px}
.numlist p{margin:0;color:var(--t3);font-size:14.5px}
.artcta{background:var(--bg1);border:1px solid var(--border);padding:30px;text-align:center;margin:50px 0 0}
.artcta h3{font-size:22px;margin-bottom:8px}
.artcta p{color:var(--t3);margin:0 0 18px}
.btn{display:inline-block;font-family:var(--fm);font-size:12px;letter-spacing:2.5px;text-transform:uppercase;padding:14px 26px;text-decoration:none}
.btn.pri{background:var(--red);color:#fff}.btn.pri:hover{background:var(--red-l)}
.btn.sec{border:1px solid var(--border);color:var(--t2)}.btn.sec:hover{border-color:var(--red);color:#fff}
@media(max-width:760px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.stats div:nth-child(2){border-right:0}.stats div{border-bottom:1px solid var(--border)}.cartbar .wrap{gap:10px}.cartbar .tot{width:100%;margin-left:0;order:3;text-align:right}}

/* ===== ambient animated background ===== */
.ambient{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.ambient span{position:absolute;border-radius:50%;filter:blur(70px);opacity:.28;mix-blend-mode:screen;will-change:transform}
.ambient span:nth-child(1){width:420px;height:420px;background:#C0392B;top:-140px;left:-80px;animation:amb1 22s ease-in-out infinite}
.ambient span:nth-child(2){width:380px;height:380px;background:#D4AC0D;bottom:-160px;right:-60px;animation:amb2 26s ease-in-out infinite}
.ambient span:nth-child(3){width:300px;height:300px;background:#2980B9;top:20%;right:10%;animation:amb3 30s ease-in-out infinite}
@keyframes amb1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.15)}}
@keyframes amb2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,-30px) scale(1.1)}}
@keyframes amb3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-30px,50px) scale(1.2)}}
.hero,.top-mini{position:relative;isolation:isolate}
.hero > *:not(.ambient),.top-mini > *:not(.ambient){position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){.ambient span{animation:none}}

.js .rv{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
.js .rv.in{opacity:1;transform:none}

<body>
<div class="wrap-n">
  <div class="hero" style="padding-top:52px">

</div>
<div class="wrap-n article" id="art"></div>
<div class="foot" id="pg-foot"></div>
<script>
(function(){
  document.documentElement.classList.add('js');
  var LANG=(function(){ var l=''; try{ l=(localStorage.getItem('sbr_lang')||'').toUpperCase(); }catch(e){} return l==='EN'?'EN':'RO'; })();
  document.documentElement.lang=LANG.toLowerCase();
  var C={RO:{"tag": "SBR AI &middot; Preventie", "h1": "AI Fraud <em>Prevention</em>", "lede": "Cum foloseste SBR inteligenta artificiala pentru a preveni frauda inainte sa produca pagube, nu doar pentru a o constata dupa fapta.", "title": "AI Fraud Prevention | SBR", "foot": "Structura Brevis Rector &middot; Continut educational, nu consultanta juridica.", "body": "\n<p class=\"lede\">Pentru mai bine de un deceniu, prevenirea fraudei s-a bazat pe reguli fixe si pe vigilenta umana. Volumul si viteza fraudei asistate de inteligenta artificiala au depasit insa capacitatea oricarui om de a verifica manual fiecare semnal. SBR AI functioneaza ca un al doilea nivel de analiza: nu inlocuieste judecata umana, ci o informeaza cu observatii pe care ochiul liber le rateaza usor.</p>\n<h2>Ce inseamna \"prevenirea fraudei asistata de AI\"</h2>\n<p>Un sistem de prevenire bazat pe inteligenta artificiala nu incearca sa \"prinda\" un fraudator dupa fapta. Scopul lui este sa intervina inainte de producerea pagubei: sa citeasca un mesaj, un document sau o imagine in cateva secunde, sa le compare cu tipare cunoscute de frauda si sa semnaleze exact ce anume face acel continut suspect, nu doar ca este \"suspect\".</p>\n<div class=\"pullquote\">Un sistem util nu spune \"este frauda\". Spune \"acest element seamana cu un tipar cunoscut de frauda, din urmatoarele motive\".</div>\n<h2>Cum lucreaza SBR AI</h2>\n<div class=\"numlist\">\n<div><b>Colectare</b><p>Utilizatorul furnizeaza textul, linkurile, adresele sau fisierele relevante. Nimic nu este analizat fara ca persoana sa fi trimis efectiv continutul.</p></div>\n<div><b>Detectie de semnale</b><p>Sistemul cauta tipare cunoscute: presiune de timp, cereri de date sensibile, domenii care imita branduri, adrese neobisnuite, tactici de izolare.</p></div>\n<div><b>Incadrare in tipologii</b><p>Semnalele gasite sunt raportate la tipologii documentate de frauda (phishing, impersonare, frauda de tip CEO, investitii false etc.), cu un grad de similaritate, nu o eticheta definitiva.</p></div>\n<div><b>Explicatie si actiune</b><p>Rezultatul include intotdeauna motivul (ce anume a fost gasit) si un plan concret: ce verifici, ce faci, ce nu faci, ce blochezi.</p></div>\n</div>\n<h2>De ce conteaza distinctia dintre \"dovada\" si \"indiciu\"</h2>\n<p>Cea mai frecventa greseala a unui sistem automat de detectie este supraincrederea: a afirma cu certitudine ca ceva este fraudulos atunci cand dovezile sunt insuficiente. SBR AI este construit sa evite exact aceasta greseala. Cand informatia disponibila nu permite o concluzie ferma, raspunsul recunoaste explicit limita, in loc sa ofere o certitudine falsa.</p>\n<div class=\"callout\"><b>Principiu de proiectare</b><p>Un fals pozitiv (a acuza pe nedrept) si un fals negativ (a rata o frauda reala) sunt ambele costisitoare. Sistemul este calibrat sa comunice nivelul de incertitudine, nu sa il ascunda.</p></div>\n<h2>Pentru companii</h2>\n<p>La nivel organizational, prevenirea asistata de AI se leaga direct de procesele interne: cine aproba o plata, cine verifica un furnizor nou, cine are acces la datele clientilor. <a href=\"verified.html\">SBR Verified</a> extinde acest principiu de la un singur mesaj suspect la intreaga structura de procese a unei companii.</p>\n"}, EN:{"tag": "SBR AI &middot; Prevention", "h1": "AI Fraud <em>Prevention</em>", "lede": "How SBR uses artificial intelligence to prevent fraud before it causes damage, rather than only recording it after the fact.", "title": "AI Fraud Prevention | SBR", "foot": "Structura Brevis Rector &middot; Educational content, not legal advice.", "body": "\n<p class=\"lede\">For more than a decade, fraud prevention relied on fixed rules and human vigilance. The volume and speed of AI-enabled fraud have outgrown what any person can manually verify. SBR AI acts as a second layer of analysis: it does not replace human judgment, it informs it with observations the naked eye easily misses.</p>\n<h2>What \"AI-assisted fraud prevention\" means</h2>\n<p>An AI-based prevention system does not try to \"catch\" a fraudster after the fact. Its purpose is to intervene before damage occurs: to read a message, document or image within seconds, compare it against known fraud patterns, and flag precisely what makes that content suspicious, not merely that it is \"suspicious\".</p>\n<div class=\"pullquote\">A useful system does not say \"this is fraud.\" It says \"this element resembles a known fraud pattern, for the following reasons.\"</div>\n<h2>How SBR AI works</h2>\n<div class=\"numlist\">\n<div><b>Collection</b><p>The user provides the relevant text, links, addresses or files. Nothing is analyzed unless the person has actually submitted the content.</p></div>\n<div><b>Signal detection</b><p>The system looks for known patterns: time pressure, requests for sensitive data, domains imitating brands, unusual addresses, isolation tactics.</p></div>\n<div><b>Typology matching</b><p>The signals found are matched against documented fraud typologies (phishing, impersonation, CEO fraud, fake investments, etc.), expressed as a degree of similarity, not a final label.</p></div>\n<div><b>Explanation and action</b><p>The result always includes the reasoning (what exactly was found) and a concrete plan: what to check, what to do, what not to do, what to block.</p></div>\n</div>\n<h2>Why the line between \"evidence\" and \"indicator\" matters</h2>\n<p>The most common failure of an automated detection system is overconfidence: stating with certainty that something is fraudulent when the evidence is insufficient. SBR AI is built to avoid exactly this failure. When the available information does not support a firm conclusion, the answer explicitly acknowledges the limit, rather than offering false certainty.</p>\n<div class=\"callout\"><b>Design principle</b><p>A false positive (wrongly accusing someone) and a false negative (missing a real fraud) are both costly. The system is calibrated to communicate the level of uncertainty, not hide it.</p></div>\n<h2>For businesses</h2>\n<p>At an organizational level, AI-assisted prevention connects directly to internal processes: who approves a payment, who verifies a new supplier, who has access to customer data. <a href=\"verified.html\">SBR Verified</a> extends this principle from a single suspicious message to a company's entire process structure.</p>\n"}};
  document.getElementById('pg-tag').textContent=C[LANG].tag;
  document.getElementById('pg-h1').innerHTML=C[LANG].h1;
  document.getElementById('pg-lede').textContent=C[LANG].lede;
  document.getElementById('art').innerHTML=C[LANG].body;
  document.title=C[LANG].title;
  document.getElementById('pg-foot').textContent=C[LANG].foot;
  document.querySelectorAll('.rv').forEach(function(el,i){ el.style.transitionDelay=(Math.min(i,6)*0.05)+'s'; });
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(en){ en.forEach(function(x){ if(x.isIntersecting){ x.target.classList.add('in'); io.unobserve(x.target); } }); },{threshold:.08});
    document.querySelectorAll('.rv').forEach(function(e){ io.observe(e); });
  } else document.querySelectorAll('.rv').forEach(function(e){ e.classList.add('in'); });
  document.addEventListener('sbr:lang:changed', function(){ location.reload(); });
  window.addEventListener('storage', function(e){ if(e.key==='sbr_lang') location.reload(); });
})();
</script>
