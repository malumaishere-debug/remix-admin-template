<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{font-family:'Lato',sans-serif;background:#080808;color:#E2E2E2;overflow-x:hidden;min-height:100vh}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit}
::-webkit-scrollbar{width:2px}::-webkit-scrollbar-thumb{background:#C0392B}
:root{
  --red:#C0392B;--red-l:#E74C3C;--green:#27AE60;--amber:#E67E22;--blue:#2980B9;
  --bg:#080808;--bg1:#0d0d0d;--bg2:#111;--bg3:#1a1a1a;
  --border:rgba(255,255,255,.06);--bdr:rgba(192,57,43,.18);
  --text:#E2E2E2;--t2:#999;--t3:#555;--t4:#333;--t5:#1e1e1e;
  --fd:'Bebas Neue',sans-serif;--fm:'IBM Plex Mono',monospace;
  --nav-h:58px;--sb-w:280px;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* LOADER */
#loader{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;gap:16px;flex-direction:column;transition:opacity .3s}
#loader.out{opacity:0;pointer-events:none}
.ld-brand{font-family:var(--fd);font-size:28px;letter-spacing:6px}
.ld-brand span{color:var(--red)}
.ld-spin{width:16px;height:16px;border:2px solid rgba(192,57,43,.15);border-top-color:var(--red);border-radius:50%;animation:spin .75s linear infinite}

/* TOPBAR */
#topbar{position:fixed;top:0;left:0;right:0;z-index:1000;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,3vw,28px);background:rgba(8,8,8,.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr)}
.tb-l{display:flex;align-items:center;gap:14px}
.tb-logo{font-family:var(--fd);font-size:20px;letter-spacing:4px;cursor:pointer}
.tb-logo b{color:var(--red);font-weight:400}
.tb-logo-sub{font-family:var(--fm);font-size:7px;letter-spacing:2px;color:var(--t4);text-transform:uppercase}
.tb-r{display:flex;align-items:center;gap:10px}
.tb-user{font-family:var(--fm);font-size:9px;color:var(--t3);display:flex;align-items:center;gap:7px}
.tb-dot{width:5px;height:5px;background:var(--green);border-radius:50%;flex-shrink:0}
.tb-btn{font-family:var(--fm);font-size:8px;letter-spacing:2px;text-transform:uppercase;background:none;border:1px solid var(--border);color:var(--t4);padding:6px 12px;transition:all .18s}
.tb-btn:hover{border-color:rgba(192,57,43,.4);color:var(--text)}

/* LAYOUT */
.training-wrap{display:grid;grid-template-columns:var(--sb-w) 1fr;margin-top:var(--nav-h);min-height:calc(100vh - var(--nav-h))}

/* SIDEBAR */
.train-sb{
  position:sticky;top:var(--nav-h);height:calc(100vh - var(--nav-h));
  overflow-y:auto;border-right:1px solid var(--border);
  background:var(--bg1);padding:20px 0;
}
.tsb-cert{margin-bottom:20px}
.tsb-cert-header{
  padding:12px 18px;display:flex;align-items:center;gap:10px;
  cursor:pointer;transition:background .15s;user-select:none;
}
.tsb-cert-header:hover{background:rgba(255,255,255,.02)}
.tsb-cert-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tsb-cert-dot.green{background:#27AE60}
.tsb-cert-dot.amber{background:#E67E22}
.tsb-cert-dot.red{background:#C0392B}
.tsb-cert-dot.locked{background:var(--t4)}
.tsb-cert-code{font-family:var(--fd);font-size:18px;letter-spacing:2px;line-height:1}
.tsb-cert-code.green{color:#27AE60}
.tsb-cert-code.amber{color:#E67E22}
.tsb-cert-code.red{color:var(--red)}
.tsb-cert-code.locked{color:var(--t4)}
.tsb-cert-name{font-family:var(--fm);font-size:8px;letter-spacing:1px;color:var(--t3);text-transform:uppercase;flex:1}
.tsb-cert-prog{font-family:var(--fm);font-size:8px;color:var(--t4)}
.tsb-modules{padding:0 0 8px}
.tsb-mod{
  display:flex;align-items:center;gap:10px;
  padding:9px 18px 9px 36px;
  font-family:var(--fm);font-size:8px;letter-spacing:1px;color:var(--t3);
  text-transform:uppercase;cursor:pointer;transition:all .15s;position:relative;
}
.tsb-mod:hover{color:var(--text);background:rgba(255,255,255,.02)}
.tsb-mod.active{color:var(--red)}
.tsb-mod.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--red)}
.tsb-mod.done{color:var(--green)}
.tsb-mod.locked-mod{color:var(--t5);pointer-events:none}
.tsb-mod-icon{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:7px}
.tsb-mod-icon.done-icon{background:var(--green);border-color:var(--green);color:#fff}
.tsb-mod-icon.active-icon{border-color:var(--red)}
.tsb-mod-icon.locked-icon{border-color:var(--t5)}
.tsb-divider{height:1px;background:var(--border);margin:8px 18px}
.tsb-locked-note{padding:10px 18px 10px 36px;font-family:var(--fm);font-size:7px;letter-spacing:2px;color:var(--t5);text-transform:uppercase}
.prog-bar-wrap{padding:0 18px 12px}
.prog-bar-track{height:2px;background:var(--border)}
.prog-bar-fill{height:100%;background:var(--green);transition:width .4s ease}
.prog-label{font-family:var(--fm);font-size:7px;letter-spacing:2px;color:var(--t4);text-transform:uppercase;margin-bottom:5px}

/* MAIN */
.train-main{padding:clamp(24px,4vw,48px);background:var(--bg);animation:fadeUp .4s ease}

/* MODULE CARD */
.module-card{max-width:760px}
.mc-breadcrumb{font-family:var(--fm);font-size:8px;letter-spacing:3px;color:var(--t4);text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.mc-breadcrumb span{color:var(--red)}
.mc-num{font-family:var(--fd);font-size:clamp(52px,8vw,88px);color:rgba(192,57,43,.15);line-height:1;margin-bottom:-8px}
.mc-title{font-family:var(--fd);font-size:clamp(28px,4.5vw,52px);letter-spacing:.5px;color:var(--text);line-height:.95;margin-bottom:10px}
.mc-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:clamp(24px,4vh,36px)}
.mc-badge{font-family:var(--fm);font-size:8px;letter-spacing:2px;color:var(--t4);border:1px solid var(--border);padding:4px 10px;text-transform:uppercase}
.mc-badge.green{color:#27AE60;border-color:rgba(39,174,96,.25)}

/* LESSON CONTENT */
.lesson-body{margin-bottom:clamp(28px,5vh,44px)}
.lesson-section{margin-bottom:clamp(20px,3.5vh,32px)}
.ls-h2{font-family:var(--fd);font-size:clamp(20px,3vw,30px);letter-spacing:.5px;color:var(--text);margin-bottom:10px}
.ls-p{font-size:clamp(14px,1.7vw,16px);color:var(--t2);line-height:1.9;margin-bottom:12px}
.ls-p:last-child{margin-bottom:0}
.ls-p strong{color:var(--text)}
.ls-p em{color:var(--amber);font-style:normal}
.ls-callout{
  background:rgba(192,57,43,.05);border-left:2px solid var(--red);
  padding:16px 20px;margin:16px 0;
}
.ls-callout-label{font-family:var(--fm);font-size:8px;letter-spacing:3px;color:rgba(192,57,43,.6);text-transform:uppercase;margin-bottom:6px}
.ls-callout p{font-size:13px;color:var(--t2);line-height:1.75}
.ls-callout p strong{color:var(--text)}
.ls-key-concepts{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:2px;background:var(--border);border:1px solid var(--border);margin:16px 0;
}
.lkc{background:var(--bg2);padding:16px;display:flex;flex-direction:column;gap:6px}
.lkc-label{font-family:var(--fm);font-size:7px;letter-spacing:3px;color:var(--red);text-transform:uppercase}
.lkc-title{font-family:var(--fd);font-size:16px;letter-spacing:.5px;color:var(--text);line-height:1}
.lkc-desc{font-size:11px;color:var(--t3);line-height:1.6}
.lesson-divider{height:1px;background:var(--border);margin:clamp(20px,3.5vh,32px) 0}

/* QUIZ */
.quiz-section{background:var(--bg2);border:1px solid var(--border);border-top:2px solid var(--red);padding:clamp(24px,4vw,40px);margin-bottom:24px}
.quiz-header{margin-bottom:24px}
.quiz-label{font-family:var(--fm);font-size:8px;letter-spacing:4px;color:rgba(192,57,43,.6);text-transform:uppercase;margin-bottom:8px}
.quiz-title{font-family:var(--fd);font-size:clamp(24px,3.5vw,36px);letter-spacing:.5px;color:var(--text);margin-bottom:6px}
.quiz-sub{font-size:13px;color:var(--t3);line-height:1.65}
.quiz-progress{font-family:var(--fm);font-size:9px;letter-spacing:2px;color:var(--t4);text-transform:uppercase;margin-top:10px}

.q-item{margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid var(--border)}
.q-item:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.q-num{font-family:var(--fm);font-size:8px;letter-spacing:3px;color:var(--t4);text-transform:uppercase;margin-bottom:8px}
.q-text{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(14px,1.8vw,17px);color:var(--text);line-height:1.7;margin-bottom:14px}
.q-options{display:flex;flex-direction:column;gap:6px}
.q-opt{
  display:flex;align-items:flex-start;gap:12px;padding:11px 16px;
  border:1px solid var(--border);cursor:pointer;transition:all .18s;
  font-size:13px;color:var(--t2);line-height:1.5;
}
.q-opt:hover{border-color:rgba(192,57,43,.3);color:var(--text)}
.q-opt.selected{border-color:var(--red);color:var(--text);background:rgba(192,57,43,.05)}
.q-opt.correct{border-color:var(--green);color:var(--green);background:rgba(39,174,96,.05)}
.q-opt.wrong{border-color:var(--red);color:var(--red);background:rgba(192,57,43,.05)}
.q-opt-key{font-family:var(--fm);font-size:9px;color:var(--t4);flex-shrink:0;width:16px;margin-top:1px}
.q-feedback{font-family:var(--fm);font-size:10px;color:var(--t3);margin-top:8px;padding:8px 12px;border-left:2px solid var(--border);display:none;line-height:1.6}
.q-feedback.show{display:block}
.q-feedback.fb-correct{border-left-color:var(--green);color:var(--green)}
.q-feedback.fb-wrong{border-left-color:var(--red);color:var(--t2)}

/* QUIZ ACTIONS */
.quiz-actions{margin-top:24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.quiz-submit-btn{
  background:var(--red);border:none;color:#fff;
  font-family:var(--fm);font-size:10px;letter-spacing:2px;text-transform:uppercase;
  padding:13px 28px;transition:background .18s;
}
.quiz-submit-btn:hover{background:var(--red-l)}
.quiz-submit-btn:disabled{opacity:.4;cursor:not-allowed}
.quiz-score-display{font-family:var(--fm);font-size:9px;letter-spacing:2px;color:var(--t3);text-transform:uppercase}

/* RESULT */
.quiz-result{
  text-align:center;padding:clamp(24px,5vh,48px);
  background:var(--bg3);border:1px solid var(--border);
  display:none;animation:fadeUp .4s ease;
}
.qr-icon{font-family:var(--fd);font-size:64px;line-height:1;margin-bottom:10px}
.qr-title{font-family:var(--fd);font-size:clamp(28px,5vw,48px);letter-spacing:1px;margin-bottom:8px}
.qr-title.pass{color:var(--green)}
.qr-title.fail{color:var(--red)}
.qr-score{font-family:var(--fm);font-size:11px;letter-spacing:3px;color:var(--t3);text-transform:uppercase;margin-bottom:16px}
.qr-message{font-size:14px;color:var(--t2);line-height:1.75;max-width:400px;margin:0 auto 20px}
.qr-btn{
  background:var(--red);border:none;color:#fff;
  font-family:var(--fm);font-size:10px;letter-spacing:2px;text-transform:uppercase;
  padding:13px 28px;transition:background .18s;
}
.qr-btn:hover{background:var(--red-l)}
.qr-btn.green-btn{background:var(--green)}
.qr-btn.green-btn:hover{background:#2ecc71}

/* CERT UNLOCK */
.cert-unlock{
  background:rgba(39,174,96,.06);border:1px solid rgba(39,174,96,.2);
  padding:clamp(24px,4vw,40px);text-align:center;margin-bottom:24px;
  display:none;animation:fadeUp .4s ease;
}
.cu-icon{font-size:48px;margin-bottom:10px}
.cu-title{font-family:var(--fd);font-size:clamp(28px,5vw,48px);color:var(--green);letter-spacing:1px;margin-bottom:8px}
.cu-sub{font-size:14px;color:var(--t2);line-height:1.75;margin-bottom:20px}
.cu-btn{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--green);border:none;color:#fff;
  font-family:var(--fm);font-size:10px;letter-spacing:2px;text-transform:uppercase;
  padding:13px 28px;transition:background .18s;cursor:pointer;
}
.cu-btn:hover{background:#2ecc71}

/* LOCKED STATE */
.locked-state{
  background:var(--bg2);border:1px solid var(--border);
  padding:clamp(32px,6vw,56px);text-align:center;
}
.ls-icon{font-family:var(--fd);font-size:64px;color:rgba(255,255,255,.05);margin-bottom:12px}
.ls-title{font-family:var(--fd);font-size:clamp(24px,4vw,40px);color:var(--t3);letter-spacing:1px;margin-bottom:8px}
.ls-desc{font-size:13px;color:var(--t4);line-height:1.75;max-width:360px;margin:0 auto 20px}
.ls-btn{display:inline-flex;align-items:center;gap:10px;background:var(--red);border:none;color:#fff;font-family:var(--fm);font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:12px 24px;cursor:pointer;transition:background .18s}
.ls-btn:hover{background:var(--red-l)}

@media(max-width:700px){
  .training-wrap{grid-template-columns:1fr}
  .train-sb{position:static;height:auto;max-height:240px}
}
</style>

h1, h2, h3, h4, h5, h6,

<style id="sbr-social-icons">
/* Hide old text-based social bar */
#sbr-social-bar, .sbr-social-bar { display: none !important; }
/* Floating icon-only social pill */
#sbr-sw {
  position: fixed; right: 14px; top: 50%; transform: translateY(-50%);
  z-index: 800; display: flex; flex-direction: column; gap: 6px;
}
.sbr-sw-a {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
  text-decoration: none; cursor: pointer;
  transition: background .2s, border-color .2s, transform .2s;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  font-size: 14px; line-height: 1;

var _res = false, _to = null;
var _unsub = sbr_db.auth.onAuthStateChange(function(ev, session){
  if(!_res){

    if(session&&session.user){
      USER.id=session.user.id;
      USER.email=session.user.email;
      document.getElementById('tb-email').textContent=USER.email;
      loadProgress().then(renderAll);
    } else {
      location.replace('login.html?next=institute-training.html');

});
_to=setTimeout(function(){

    sbr_db.auth.getSession().then(function(r){
      if(r&&r.data&&r.data.session){
        USER.id=r.data.session.user.id;

/* ─── LOAD PROGRESS ─── */
async function loadProgress(){
  try {
    var r=await sbr_db.from('training_progress')
      .select('cert_code,module_num,quiz_score,completed_at')
      .eq('user_id',USER.id);
    if(r.data){
      r.data.forEach(function(row){
        if(!PROGRESS[row.cert_code])PROGRESS[row.cert_code]={done:[],scores:{}};
        PROGRESS[row.cert_code].done.push(row.module_num);
        PROGRESS[row.cert_code].scores[row.module_num]=row.quiz_score;
      });
    }
    /* Load profile for plan */
    var pr=await sbr_db.from('profiles').select('plan').eq('id',USER.id).single();
    if(pr.data)USER.plan=(pr.data.plan||'free').toLowerCase();
  } catch(e) {}
}

async function saveProgress(certCode, moduleNum, score){
  try {
    await sbr_db.from('training_progress').upsert({
      user_id:USER.id, cert_code:certCode, module_num:moduleNum,
      quiz_score:score, completed_at: new Date().toISOString()
    },{onConflict:'user_id,cert_code,module_num'});
    if(!PROGRESS[certCode])PROGRESS[certCode]={done:[],scores:{}};
    if(PROGRESS[certCode].done.indexOf(moduleNum)<0)PROGRESS[certCode].done.push(moduleNum);
    PROGRESS[certCode].scores[moduleNum]=score;
  } catch(e){}
}

async function issueCertificate(certCode){
  try {
    var uuid = ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,function(c){
      return(c^(window.crypto||window.msCrypto).getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16);
    });
    await sbr_db.from('certifications_issued').upsert({
      id:uuid, user_id:USER.id, email:USER.email,
      cert_code:certCode, issued_at:new Date().toISOString(),
      expires_at:new Date(Date.now()+2*365*24*3600*1000).toISOString()
    },{onConflict:'user_id,cert_code'});
    return uuid;
  } catch(e){ return null; }
}

/* ─── HELPERS ─── */
function isDone(certCode, modNum){
  return PROGRESS[certCode]&&PROGRESS[certCode].done.indexOf(modNum)>-1;
}
function certDone(certCode){
  var cert=CERTS[certCode];
  return cert.modules.every(function(m){return isDone(certCode,m.num);});
}
function certUnlocked(certCode){
  var cert=CERTS[certCode];
  if(!cert.prereq)return true;
  return certDone(cert.prereq);
}
function modUnlocked(certCode, modNum){
  if(!certUnlocked(certCode))return false;
  if(modNum===1)return true;
  return isDone(certCode, modNum-1);
}
function certProg(certCode){
  var cert=CERTS[certCode];
  var done=cert.modules.filter(function(m){return isDone(certCode,m.num);}).length;
  return Math.round(done/cert.modules.length*100);
}

  setTimeout(function(){ldr.style.display='none';},350);

/* ─── SIDEBAR ─── */
function renderSidebar(){
  var sb=document.getElementById('train-sb');
  var html='';
  Object.keys(CERTS).forEach(function(certKey){
    var cert=CERTS[certKey];
    var unlocked=certUnlocked(certKey);
    var prog=certProg(certKey);
    var colCls=unlocked?cert.color:'locked';
    html+='<div class="tsb-cert">';
    html+='<div class="prog-bar-wrap"><div class="prog-label">'+cert.code+' — '+prog+'%</div><div class="prog-bar-track"><div class="prog-bar-fill" style="width:'+prog+'%"></div></div></div>';
    html+='<div class="tsb-cert-header" onclick="toggleCert(\''+certKey+'\')">';
    html+='<div class="tsb-cert-dot '+colCls+'"></div>';
    html+='<div class="tsb-cert-code '+colCls+'">'+cert.code+'</div>';
    html+='<div class="tsb-cert-name">'+cert.title+'</div>';
    html+='</div>';
    if(unlocked){
      html+='<div class="tsb-modules" id="tsb-mods-'+certKey+'">';
      cert.modules.forEach(function(mod){
        var done=isDone(certKey,mod.num);
        var unlk=modUnlocked(certKey,mod.num);
        var active=CURRENT.cert===certKey&&CURRENT.module===mod.num;
        var cls=done?'done':(active?'active':'')+(unlk?'':' locked-mod');
        var iconCls=done?'done-icon':(active?'active-icon':'locked-icon');
        var icon=done?'✓':'';
        html+='<div class="tsb-mod '+cls+'" onclick="navTo(\''+certKey+'\','+mod.num+')">';
        html+='<div class="tsb-mod-icon '+iconCls+'">'+icon+'</div>';
        html+='M'+mod.num+' '+mod.title;
        html+='</div>';
      });
      html+='</div>';
    } else {
      html+='<div class="tsb-locked-note">🔒 Completează '+(CERTS[cert.prereq]?CERTS[cert.prereq].code:'')+'</div>';
    }
    html+='<div class="tsb-divider"></div>';
    html+='</div>';
  });
  sb.innerHTML=html;
}

function toggleCert(certKey){
  var el=document.getElementById('tsb-mods-'+certKey);
  if(el)el.style.display=el.style.display==='none'?'':'none';
}

function navTo(certKey, modNum){
  if(!modUnlocked(certKey,modNum))return;
  CURRENT.cert=certKey;
  CURRENT.module=modNum;
  quizAnswers={};
  quizSubmitted=false;
  renderSidebar();
  renderModuleContent(certKey, modNum);
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ─── MODULE CONTENT ─── */
function renderModuleContent(certKey, modNum){
  var cert=CERTS[certKey];
  var mod=cert.modules.find(function(m){return m.num===modNum;});
  var main=document.getElementById('train-main');

  if(!certUnlocked(certKey)||!mod){
    main.innerHTML=renderLocked(cert);
    return;
  }
  if(!modUnlocked(certKey,modNum)){
    main.innerHTML=renderModLocked(mod,modNum-1);
    return;
  }

  var html='<div class="module-card">';
  /* Breadcrumb */
  html+='<div class="mc-breadcrumb"><span>'+cert.code+'</span>&rarr; Modul '+modNum+' din '+cert.modules.length+'</div>';
  /* Number + title */
  html+='<div class="mc-num">0'+modNum+'</div>';
  html+='<div class="mc-title">'+mod.title+'</div>';
  html+='<div class="mc-meta">';
  if(mod.readMin)html+='<span class="mc-badge">~'+mod.readMin+' min</span>';
  if(mod.quizCount)html+='<span class="mc-badge">'+mod.quizCount+' întrebări quiz</span>';
  html+='<span class="mc-badge green">70% threshold</span>';
  if(isDone(certKey,modNum)){
    var sc=PROGRESS[certKey]&&PROGRESS[certKey].scores[modNum];
    html+='<span class="mc-badge" style="color:var(--green);border-color:rgba(39,174,96,.25)">✓ Completat'+( sc?' — '+sc+'%':'')+' </span>';
  }
  html+='</div>';

  /* Lesson body */
  if(mod.content&&mod.content.length>0){
    html+='<div class="lesson-body">'+renderContent(mod.content)+'</div>';
  } else {
    html+='<div class="lesson-body"><div class="lesson-section"><p class="ls-p" style="color:var(--t3);font-style:italic">Conținutul complet al acestui modul va fi disponibil la lansarea platformei de training SBR Institute. Înregistrează-te pentru Early Access pentru a fi notificat.</p></div></div>';
  }

  /* Quiz */
  if(mod.quiz&&mod.quiz.length>0){
    html+=renderQuiz(mod, certKey);
  } else if(mod.quizCount>0){
    html+='<div class="quiz-section"><div class="quiz-header"><div class="quiz-label">Quiz &middot; Modul '+modNum+'</div><div class="quiz-title">Validare cunoștințe</div><div class="quiz-sub">Quiz-ul complet va fi disponibil la lansare. Înregistrează-te pentru Early Access.</div></div></div>';
  }

  /* Nav buttons */
  html+='<div style="display:flex;gap:10px;margin-top:24px;flex-wrap:wrap">';
  if(modNum>1){
    html+='<button class="tb-btn" onclick="navTo(\''+certKey+'\','+(modNum-1)+')" style="padding:10px 20px">&larr; Modul '+(modNum-1)+'</button>';
  }
  if(modNum<cert.modules.length&&isDone(certKey,modNum)){
    html+='<button class="tb-btn" style="background:var(--red);border-color:var(--red);color:#fff;padding:10px 20px" onclick="navTo(\''+certKey+'\','+(modNum+1)+')">Modul '+(modNum+1)+' &rarr;</button>';
  }
  html+='</div>';
  html+='</div>';

  main.innerHTML=html;
}

function renderContent(content){
  return content.map(function(block){
    if(block.type==='intro') return '<div class="lesson-section"><p class="ls-p">'+block.text+'</p></div>';
    if(block.type==='h2') return '<div class="lesson-section" style="margin-top:clamp(16px,3vh,28px)"><h2 class="ls-h2">'+block.text+'</h2></div>';
    if(block.type==='p') return '<p class="ls-p">'+block.text+'</p>';
    if(block.type==='callout') return '<div class="ls-callout"><div class="ls-callout-label">'+block.label+'</div><p>'+block.text+'</p></div>';
    if(block.type==='keyconcepts'){
      return '<div class="ls-key-concepts">'+block.items.map(function(item){
        return '<div class="lkc"><div class="lkc-label">'+item.label+'</div><div class="lkc-title">'+item.title+'</div><div class="lkc-desc">'+item.desc+'</div></div>';
      }).join('')+'</div>';
    }
    return '';
  }).join('');
}

    html+='<div class="cu-sub">Ai finalizat toate modulele '+CERTS[certKey].code+'. Certificatul tău este gata.</div>';
    html+='<button class="cu-btn" onclick="downloadCert(\''+certKey+'\')">Descarcă certificatul PDF &rarr;</button>';
    html+='</div>';
  }

  return html;
}

function renderLocked(cert){
  return '<div class="locked-state">'
    +'<div class="ls-icon">🔒</div>'
    +'<div class="ls-title">Necesită '+CERTS[cert.prereq].code+'</div>'
    +'<p class="ls-desc">Completează certificarea '+CERTS[cert.prereq].code+' — '+CERTS[cert.prereq].title+' — pentru a debloca acest track.</p>'
    +'<button class="ls-btn" onclick="navTo(\''+cert.prereq+'\',1)">Continuă '+CERTS[cert.prereq].code+' &rarr;</button>'
    +'</div>';
}
function renderModLocked(mod, prevMod){

    +'<div class="ls-icon">🔒</div>'
    +'<div class="ls-title">Modul blocat</div>'

}

/* ─── QUIZ INTERACTION ─── */
function selectOpt(qi, oi, total){
  if(quizSubmitted)return;
  /* Deselect all opts for this question */
  for(var i=0;i<10;i++){
    var el=document.getElementById('qopt-'+qi+'-'+i);
    if(!el)break;
    el.classList.remove('selected');
  }
  document.getElementById('qopt-'+qi+'-'+oi).classList.add('selected');
  quizAnswers[qi]=oi;
  /* Update progress counter */
  var count=Object.keys(quizAnswers).length;
  var prog=document.getElementById('qprog');
  if(prog)prog.textContent=count+' / '+total+' răspunsuri';
  /* Enable submit when all answered */
  var btn=document.getElementById('quiz-submit');
  if(btn)btn.disabled=(count<total);
}

async function submitQuiz(certKey, modNum, isFinal){
  if(quizSubmitted)return;
  quizSubmitted=true;
  var mod=CERTS[certKey].modules.find(function(m){return m.num===modNum;});
  var correct=0;
  mod.quiz.forEach(function(q,qi){
    var chosen=quizAnswers[qi];
    var isCorrect=(chosen===q.correct);
    if(isCorrect)correct++;
    /* Color options */
    var correctEl=document.getElementById('qopt-'+qi+'-'+q.correct);
    if(correctEl)correctEl.classList.add('correct');
    if(!isCorrect&&chosen!==undefined){
      var wrongEl=document.getElementById('qopt-'+qi+'-'+chosen);
      if(wrongEl)wrongEl.classList.add('wrong');
    }
    /* Show feedback */
    var fb=document.getElementById('qfb-'+qi);
    if(fb){
      fb.classList.add('show');
      fb.classList.add(isCorrect?'fb-correct':'fb-wrong');
    }
  });

  var score=Math.round(correct/mod.quiz.length*100);
  var passed=score>=70;
  var btn=document.getElementById('quiz-submit');
  if(btn)btn.style.display='none';
  var info=document.getElementById('quiz-score-info');
  if(info)info.textContent='Scor: '+score+'% ('+correct+'/'+mod.quiz.length+' corecte)';

  /* Show result */
  var resultEl=document.getElementById('quiz-result');
  if(resultEl){
    resultEl.style.display='block';
    if(passed){
      resultEl.innerHTML='<div class="qr-icon">✓</div>'
        +'<div class="qr-title pass">Promovat!</div>'
        +'<div class="qr-score">'+score+'% — '+correct+'/'+mod.quiz.length+' corecte</div>'
        +'<p class="qr-message">'+(isFinal?'Excelent! Ai finalizat toate modulele. Certificatul tău este gata.':'Modul completat. '+(modNum<CERTS[certKey].modules.length?'Modulul '+(modNum+1)+' este acum deblocat.':''))+'</p>'
        +(isFinal?'':('<button class="qr-btn green-btn" onclick="navTo(\''+certKey+'\','+(modNum+1)+')">Modul '+(modNum+1)+' &rarr;</button>'));
    } else {
      resultEl.innerHTML='<div class="qr-icon">✗</div>'
        +'<div class="qr-title fail">Sub 70%</div>'
        +'<div class="qr-score">'+score+'% — '+correct+'/'+mod.quiz.length+' corecte</div>'
        +'<p class="qr-message">Reia lecția și încearcă din nou. Minimum 70% pentru a avansa.</p>'
        +'<button class="qr-btn" onclick="retryQuiz()">Încearcă din nou</button>';
    }
  }

  if(passed){
    await saveProgress(certKey, modNum, score);
    if(isFinal){
      var unlockEl=document.getElementById('cert-unlock');
      if(unlockEl)unlockEl.style.display='block';
      await issueCertificate(certKey);
    }
    renderSidebar();
  }
}

function retryQuiz(){
  quizAnswers={};
  quizSubmitted=false;
  renderModuleContent(CURRENT.cert, CURRENT.module);
}

/* ─── CERTIFICATE PDF ─── */
async function downloadCert(certKey) {
  var name = USER.name || USER.email.split('@')[0];
  var now  = new Date();
  var issuedStr = now.toLocaleDateString('ro-RO', {day:'2-digit',month:'long',year:'numeric'});
  var expYear = now.getFullYear() + 2;
  var expStr = 'Aprilie ' + expYear;
  var certId = ({faa:'SBR-FAA',bpa:'SBR-BPA',cfi:'SBR-CFI'}[certKey]||'SBR') + '-' + now.getFullYear() + '-' + Math.random().toString(36).substr(2,8).toUpperCase();

  var params = new URLSearchParams({
    cert: certKey,
    name: name,
    code: certId,
    issued: issuedStr,
    expires: expStr
  });

  window.open('diploma.html?' + params.toString(), '_blank');
}

function doLogout(){
  sbr_db.auth.signOut().then(function(){location.href='login.html';}).catch(function(){location.href='login.html';});
}
