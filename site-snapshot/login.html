<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Lato',sans-serif;background:#0A0A0A;color:#e0e0e0;min-height:100vh;overflow-x:hidden}
:root{--red:#C0392B;--redL:#E74C3C;--dark:#111;--dark2:#1A1A1A}

.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:4px;cursor:pointer;display:flex;align-items:center}
.nav-logo span{color:var(--red)}

#nav-right{display:flex;align-items:center;gap:16px}
.nb{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#aaa;padding:4px 0;transition:color .2s;font-family:'IBM Plex Mono',monospace}
.nb:hover{color:var(--red)}
.nb-ghost{background:transparent;border:1px solid rgba(255,255,255,.1);color:#aaa;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:7px 14px;transition:all .2s;display:inline-block}
.nb-ghost:hover{border-color:var(--red);color:var(--red)}
.nb-solid{background:var(--red);border:none;color:#fff;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:8px 16px;cursor:pointer;transition:background .2s;display:inline-block}
.nb-solid:hover{background:var(--redL)}

/* ── AUTH LAYOUT ── */
.auth-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:80px 20px 40px;background:radial-gradient(ellipse 60% 50% at 50% 40%,rgba(192,57,43,.05) 0%,transparent 70%);position:relative}
.auth-bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(192,57,43,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(192,57,43,.025) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 20%,transparent 100%)}
.auth-card{position:relative;width:100%;max-width:400px;background:var(--dark);border:1px solid rgba(255,255,255,.06);border-top:2px solid var(--red);padding:44px 40px}

.auth-logo{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:4px;margin-bottom:6px}
.auth-logo span{color:var(--red)}
.auth-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:3px;color:#666;text-transform:uppercase;margin-bottom:28px;display:flex;align-items:center;gap:8px}
.auth-eyebrow::before{content:'';display:block;width:12px;height:1px;background:var(--red)}
.auth-title{font-family:'Bebas Neue',sans-serif;font-size:36px;color:#fff;line-height:1;margin-bottom:6px}
.auth-sub{font-size:12px;color:#777;margin-bottom:32px;line-height:1.6}

.field{margin-bottom:14px}
.field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:2px;color:#777;text-transform:uppercase;margin-bottom:6px}
.field input{width:100%;background:#0A0A0A;border:1px solid rgba(255,255,255,.07);color:#ddd;font-family:'Lato',sans-serif;font-size:14px;padding:11px 14px;transition:border-color .2s;outline:none}
.field input:focus{border-color:rgba(192,57,43,.4)}
.field input::placeholder{color:#555}

.forgot-row{display:flex;justify-content:flex-end;margin-top:-6px;margin-bottom:20px}
.forgot-link{font-family:'IBM Plex Mono',monospace;font-size:9px;color:#666;letter-spacing:1px;cursor:pointer;transition:color .2s;background:none;border:none;padding:0}
.forgot-link:hover{color:var(--red)}

.auth-btn{width:100%;background:var(--red);border:none;color:#fff;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;padding:14px;cursor:pointer;transition:background .2s;margin-bottom:18px}
.auth-btn:hover{background:var(--redL)}
.auth-btn:disabled{opacity:.5;cursor:not-allowed}

.auth-err{background:rgba(192,57,43,.1);border:1px solid rgba(192,57,43,.3);color:#e74c3c;font-family:'IBM Plex Mono',monospace;font-size:10px;padding:10px 14px;margin-bottom:14px;display:none;letter-spacing:.5px;line-height:1.5}
.auth-ok{background:rgba(46,204,113,.07);border:1px solid rgba(46,204,113,.3);color:#2ecc71;font-family:'IBM Plex Mono',monospace;font-size:10px;padding:10px 14px;margin-bottom:14px;display:none;letter-spacing:.5px;line-height:1.5}

.auth-sep{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.auth-sep-line{flex:1;height:1px;background:rgba(255,255,255,.05)}
.auth-sep-text{font-family:'IBM Plex Mono',monospace;font-size:8px;color:#555;letter-spacing:2px;text-transform:uppercase}

.auth-switch{text-align:center;font-size:12px;color:#666;font-family:'IBM Plex Mono',monospace;letter-spacing:.5px}
.auth-switch a{color:var(--red);transition:opacity .2s}
.auth-switch a:hover{opacity:.7}

/* Reset password form */
.reset-form{display:none}
.back-btn{background:none;border:none;color:#777;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;padding:0;margin-bottom:20px;display:flex;align-items:center;gap:8px;transition:color .2s}
.back-btn:hover{color:var(--red)}
.back-btn::before{content:'←'}

@media(max-width:480px){.auth-card{padding:32px 24px}.auth-bg{padding:70px 16px 32px}#nav-right{display:none}}

<script>

/* ── LOGIN ── */
async function doLogin() {
  var email = document.getElementById('l-email').value.trim();
  var pass  = document.getElementById('l-pass').value;
  var err   = document.getElementById('l-err');
  var btn   = document.getElementById('l-btn');
  err.style.display = 'none';

  if (!email || !pass) { showErr(err, 'Completează email și parolă.'); return; }
  if (!email.includes('@')) { showErr(err, 'Adresă de email invalidă.'); return; }

  btn.textContent = 'Se conectează…';
  btn.disabled = true;

  try {
    var result = await sbr_db.auth.signInWithPassword({ email: email, password: pass });
    if (result.error) throw result.error;

    /* Redirect: back to original page or dashboard */
    var params = new URLSearchParams(window.location.search);
    var redirect = params.get('redirect') || 'dashboard.html';
    window.location.href = decodeURIComponent(redirect);

  } catch (e) {
    btn.textContent = 'Accesează →';
    btn.disabled = false;
    var msg = e.message || 'Email sau parolă incorectă.';
    if (msg.includes('Invalid login') || msg.includes('credentials')) {
      msg = 'Email sau parolă incorectă.';
    } else if (msg.includes('Email not confirmed')) {
      msg = 'Confirmă emailul înainte de a te autentifica. Verifică inbox-ul.';
    }
    showErr(err, msg);
  }
}

/* ── RESET PASSWORD ── */
async function doReset() {
  var email = document.getElementById('r-email').value.trim();
  var err   = document.getElementById('r-err');
  var ok    = document.getElementById('r-ok');
  var btn   = document.getElementById('r-btn');
  err.style.display = 'none';
  ok.style.display  = 'none';

  if (!email || !email.includes('@')) { showErr(err, 'Introdu o adresă de email validă.'); return; }

  btn.textContent = 'Se trimite…';
  btn.disabled = true;

  try {
    var result = await sbr_db.auth.resetPasswordForEmail(email, {
      redirectTo: 'https://sbr.systems/set-password.html'
    });
    if (result.error) throw result.error;
    ok.textContent = 'Link de resetare trimis la ' + email + '. Verifică inbox și folderul Spam. Dă click pe link — te duce direct la setarea parolei noi.';
    ok.style.display = 'block';
    btn.textContent = 'Trimis ✓';
  } catch (e) {
    btn.textContent = 'Trimite link de resetare →';
    btn.disabled = false;
    showErr(err, e.message || 'Eroare la trimiterea emailului.');
  }
}

function showReset() {
  document.getElementById('login-form').style.display = 'none';
  document.getElementById('reset-form').style.display = 'block';
}
function showLogin() {
  document.getElementById('reset-form').style.display = 'none';
  document.getElementById('login-form').style.display = 'block';
}
function showErr(el, msg) {
  el.textContent = msg;
  el.style.display = 'block';
}

/* ── Enter key ── */
document.addEventListener('DOMContentLoaded', function() {
  ['l-email','l-pass'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
  });

  /* Redirect if already logged in */
  sbr_db.auth.getSession().then(function(res) {
    if (res.data && res.data.session) {
      var params = new URLSearchParams(window.location.search);
      window.location.href = params.get('redirect') || 'dashboard.html';
    }
  });
});
</script>
