<style>
:root{--red:#C0392B;--red-l:#E74C3C;--blue:#2980B9;--gold:#D4AC0D;--bg0:#0c0c0c;--bg1:#111;--bg2:#181818;--border:rgba(255,255,255,.08);--text:#F7F7F7;--t2:#D2D2D2;--t3:#ADADAD;--t4:#808080;--fm:"IBM Plex Mono",monospace;--fd:"Bebas Neue",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;padding-top:58px;background:var(--bg0);color:var(--text);font-family:"Lato",sans-serif;-webkit-text-size-adjust:100%;display:flex;flex-direction:column}
.shell{flex:1;display:flex;flex-direction:column;max-width:820px;margin:0 auto;width:100%;min-height:calc(100vh - 58px)}
.top-mini{text-align:center;padding:22px 20px 14px;flex-shrink:0}
.tag{font-family:var(--fm);font-size:10px;letter-spacing:4px;color:rgba(192,57,43,.85);text-transform:uppercase;margin:0 0 10px}
h1{font-family:var(--fd);font-size:clamp(30px,5.2vw,44px);letter-spacing:.5px;margin:0 0 6px;color:#fff;line-height:1.05}
.sub{color:var(--t3);font-size:14.5px;margin:0}
.wip-badge{display:inline-block;margin-left:8px;font-family:var(--fm);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;padding:3px 9px;border:1px solid rgba(212,172,13,.4);color:var(--gold);border-radius:99px;vertical-align:middle}
.thread{flex:1;overflow-y:auto;padding:10px 18px 14px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.thread{position:relative}
.chat-bg{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.chat-bg img{width:100%;height:100%;object-fit:cover;opacity:.16;filter:saturate(1.1)}
.chat-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,12,12,.75),rgba(12,12,12,.92) 60%,var(--bg0) 100%)}
.chat-bg-mark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);opacity:.5}
.thread > *:not(.chat-bg){position:relative;z-index:1}

.starters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:6px 4px 18px}
.starters button{font-family:var(--fm);font-size:12px;letter-spacing:.5px;padding:10px 16px;background:var(--bg1);border:1px solid var(--border);color:var(--t2);text-align:left}
.starters button:hover{border-color:rgba(192,57,43,.4);color:#fff}
.msg{max-width:86%;display:flex;flex-direction:column;gap:6px}
.msg{animation:msgin .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes msgin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.msg{animation:none}}
.msg.u{align-self:flex-end;align-items:flex-end}
.msg.b{align-self:flex-start;align-items:flex-start}
.bubble{padding:13px 16px;border-radius:3px;font-size:15.5px;line-height:1.55;white-space:pre-wrap}
.msg.u .bubble{background:var(--red);color:#fff;border-radius:14px 14px 3px 14px}
.msg.b .bubble{background:var(--bg1);border:1px solid var(--border);color:var(--text);border-radius:14px 14px 14px 3px}
.msg .atts{display:flex;gap:6px;flex-wrap:wrap}
.att-chip{font-family:var(--fm);font-size:11px;padding:4px 10px;border:1px solid var(--border);border-radius:99px;color:var(--t3);display:flex;align-items:center;gap:6px}
.att-chip img{width:20px;height:16px;object-fit:cover;border-radius:2px}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--t4);animation:tb 1.2s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes tb{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
/* analysis card, inline in a bot bubble */
.acard{background:var(--bg2);border:1px solid var(--border);padding:16px;border-radius:14px 14px 14px 3px;max-width:100%}
.acard .row1{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.acard svg{flex-shrink:0}
.acard .band{font-family:var(--fm);font-size:11px;letter-spacing:2px;text-transform:uppercase;padding:4px 10px;border-radius:99px;display:inline-block;margin-bottom:4px}
.acard .band.ok{background:rgba(39,174,96,.15);color:#27AE60}
.acard .band.mid{background:rgba(230,126,34,.15);color:#E67E22}
.acard .band.bad{background:rgba(192,57,43,.15);color:var(--red-l)}
.acard .expl{font-size:14.5px;color:var(--t2);margin:0}
.acard h4{font-family:var(--fd);font-size:16px;color:#fff;margin:14px 0 6px;letter-spacing:.3px}
.acard ul{margin:0;padding-left:18px}
.acard li{font-size:14px;color:var(--t2);margin:4px 0}
.acard .sigq{color:var(--t4);font-style:italic;font-size:12.5px;display:block;margin-top:2px}
.acard .limits{font-size:12.5px;color:var(--t4);margin-top:12px;border-top:1px solid var(--border);padding-top:10px}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.qchips button{font-family:var(--fm);font-size:11px;padding:7px 12px;background:var(--bg0);border:1px solid var(--border);color:var(--t2);border-radius:99px}
.qchips button:hover{border-color:var(--red);color:#fff}
.change{border-top:1px solid var(--border);margin-top:10px;padding-top:10px;font-size:13px}
.change .up{color:var(--red-l);font-weight:600}.change .down{color:#27AE60;font-weight:600}
.plan4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.plan4 div{background:var(--bg0);border:1px solid var(--border);padding:10px 12px}
.plan4 b{display:block;font-family:var(--fm);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--t4);margin-bottom:6px}
.plan4 ul{margin:0;padding-left:16px}.plan4 li{font-size:13px;color:var(--t2);margin:3px 0}
.composer{flex-shrink:0;border-top:1px solid var(--border);padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg0)}
.att-preview{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.att-item{position:relative;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--bg1);padding:5px 26px 5px 8px;font-size:12px;color:var(--t3);display:flex;align-items:center;gap:6px}
.att-item img{width:32px;height:26px;object-fit:cover;border-radius:3px}
.att-item button{position:absolute;top:1px;right:1px;width:18px;height:18px;border:0;border-radius:50%;background:var(--red);color:#fff;font-size:12px;line-height:1;padding:0}
.compose-row{display:flex;align-items:flex-end;gap:8px;background:var(--bg1);border:1px solid var(--border);border-radius:22px;padding:8px 8px 8px 16px}
.compose-row textarea{flex:1;resize:none;border:0;background:transparent;color:#fff;font:16px/1.4 "Lato",sans-serif;max-height:120px;outline:none;padding:8px 0}
.compose-row textarea::placeholder{color:var(--t4)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:var(--t3);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.icon-btn:hover{background:var(--bg2);color:#fff}
.send-btn{width:38px;height:38px;border-radius:50%;border:0;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send-btn:hover{background:var(--red-l)}
.send-btn[disabled]{background:var(--bg2);color:var(--t4)}
.consent-line{font-family:var(--fm);font-size:9.5px;color:var(--t4);text-align:center;margin-top:8px;letter-spacing:.3px}
.consent-line a{color:var(--t3)}
.fallback-note{font-family:var(--fm);font-size:11px;color:var(--gold);background:rgba(212,172,13,.08);border:1px solid rgba(212,172,13,.25);padding:8px 12px;border-radius:8px;margin-bottom:4px}
@media(max-width:600px){.plan4{grid-template-columns:1fr}.msg{max-width:94%}}
@media(prefers-reduced-motion:reduce){.typing span{animation:none}}

/* ===== ambient animated background ===== */
.ambient{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.ambient span{position:absolute;border-radius:50%;filter:blur(70px);opacity:.28;mix-blend-mode:screen;will-change:transform}
.ambient span:nth-child(1){width:420px;height:420px;background:#C0392B;top:-140px;left:-80px;animation:amb1 22s ease-in-out infinite}
.ambient span:nth-child(2){width:380px;height:380px;background:#D4AC0D;bottom:-160px;right:-60px;animation:amb2 26s ease-in-out infinite}
.ambient span:nth-child(3){width:300px;height:300px;background:#2980B9;top:20%;right:10%;animation:amb3 30s ease-in-out infinite}
@keyframes amb1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.15)}}
@keyframes amb2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,-30px) scale(1.1)}}
@keyframes amb3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-30px,50px) scale(1.2)}}
.hero,.top-mini{position:relative;isolation:isolate}
.hero > *:not(.ambient),.top-mini > *:not(.ambient){position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){.ambient span{animation:none}}

</style>
</head>
<body>
<div class="shell">
  <div class="top-mini">
    <div class="ambient" aria-hidden="true"><span></span><span></span><span></span></div>
    <p class="tag" id="pg-tag"></p><span class="wip-badge" id="wip-badge"></span>
    <h1 id="pg-h1"></h1>
    <p class="sub" id="pg-sub"></p>
  </div>
  <div class="thread" id="thread">
    <div class="chat-bg" aria-hidden="true"><img src="img/chat-bg.jpg" alt=""><div class="chat-bg-mark"><svg viewBox="0 0 200 200" width="180" height="180"><circle cx="100" cy="100" r="96" fill="none" stroke="#C0392B" stroke-width="1.5" opacity=".55"/><rect x="66" y="92" width="68" height="56" rx="6" fill="none" stroke="#C0392B" stroke-width="3" opacity=".7"/><path d="M78 92 v-18 a22 22 0 0 1 44 0 v18" fill="none" stroke="#C0392B" stroke-width="3" opacity=".7"/><circle cx="100" cy="116" r="6" fill="#C0392B" opacity=".7"/><rect x="97" y="120" width="6" height="14" fill="#C0392B" opacity=".7"/><text x="100" y="176" text-anchor="middle" font-family="Bebas Neue,sans-serif" font-size="22" letter-spacing="4" fill="#C0392B" opacity=".6">SBR</text></svg></div></div>
    <div class="starters" id="starters"></div>
  </div>
  <div class="composer">
    <div class="att-preview" id="att-preview"></div>

      <button type="button" class="icon-btn" id="attach-btn" aria-label="Attach file">📎</button>
      <input type="file" id="file-in" accept="image/*,.pdf,.txt,.eml" multiple style="display:none">
      <textarea id="in-text" rows="1"></textarea>
      <button type="button" class="icon-btn send-btn" id="send-btn" aria-label="Send">&#10148;</button>

</div>

<script>
/* ===== SBR shared core (API client, upload, redaction) ===== */
var SBR=(function(){
  var API={ai:'https://structurabrevisrector.app.n8n.cloud/webhook/sbr-ai',save:'https://structurabrevisrector.app.n8n.cloud/webhook/sbr-save',timeout:90000};
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function session(){
    try{ var k=sessionStorage.getItem('sbr_sid'); if(k) return k; }catch(e){}
    var id='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    try{ sessionStorage.setItem('sbr_sid',id); }catch(e){}
    return id;
  }
  function post(url,body){
    if(typeof fetch!=='function') return Promise.reject(new Error('fetch indisponibil'));
    var ctl=(typeof AbortController==='function')?new AbortController():null,t=null;
    if(ctl) t=setTimeout(function(){ ctl.abort(); },API.timeout);
    try{ if(window.SBR_AILIMIT&&body&&body.action){ body.auth=window.SBR_AILIMIT.authPayload(); } }catch(e){}
    return fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(body),signal:ctl?ctl.signal:undefined})
      .then(function(r){ if(t) clearTimeout(t); if(!r.ok) throw new Error('http '+r.status); return r.json(); })
      .catch(function(e){ if(t) clearTimeout(t); throw e; });
  }
  function luhn(d){ var s=0,alt=false; for(var i=d.length-1;i>=0;i--){ var n=+d.charAt(i); if(alt){ n*=2; if(n>9) n-=9; } s+=n; alt=!alt; } return s%10===0; }
  function redact(t){
    var count=0; t=String(t||'');
    t=t.replace(/\b(?:\d[ -]?){12,18}\d\b/g,function(m){ var d=m.replace(/\D/g,''); if(d.length>=13&&d.length<=19&&luhn(d)){ count++; return '[NUMAR CARD ELIMINAT]'; } return m; });
    t=t.replace(/\b[1-8]\d{12}\b/g,function(){ count++; return '[CNP ELIMINAT]'; });
    return {text:t,count:count};
  }
  function uniq(a){ var o={},r=[]; a.forEach(function(x){ var k=x.toLowerCase(); if(!o[k]){ o[k]=1; r.push(x); } }); return r; }
  function extract(text){
    text=String(text||'');
    var links=uniq((text.match(/(?:https?:\/\/|www\.)[^\s<>"')\]]+/gi)||[]).map(function(x){ return x.replace(/[.,;:!?]+$/,''); }));
    var emails=uniq(text.match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g)||[]);
    var phones=uniq(text.match(/(?:\+40|0040|0)[ .-]?7\d{2}[ .-]?\d{3}[ .-]?\d{3}/g)||[]);
    return {links:links,emails:emails,phones:phones};
  }
  function readImage(file){
    return new Promise(function(res,rej){
      var fr=new FileReader();
      fr.onload=function(){
        var img=new Image();
        img.onload=function(){
          var max=1400,k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
          c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          var url=c.toDataURL('image/jpeg',.82);
          res({name:file.name,kind:'image',media_type:'image/jpeg',data:url.split(',')[1],preview:url});
        };
        img.onerror=function(){ rej(new Error('Imaginea nu poate fi citita.')); };
        img.src=fr.result;
      };
      fr.onerror=function(){ rej(new Error('Fisierul nu poate fi citit.')); };
      fr.readAsDataURL(file);
    });
  }
  function readFile(file){
    var n=(file.name||'').toLowerCase();
    if(/^image\//.test(file.type)) { if(file.size>12*1024*1024) return Promise.reject(new Error('Imaginea "'+file.name+'" depaseste 12 MB.')); return readImage(file); }
    if(file.type==='application/pdf'||/\.pdf$/.test(n)){
      if(file.size>3*1024*1024) return Promise.reject(new Error('PDF-ul "'+file.name+'" depaseste 3 MB.'));
      return new Promise(function(res,rej){ var fr=new FileReader(); fr.onload=function(){ res({name:file.name,kind:'pdf',media_type:'application/pdf',data:String(fr.result).split(',')[1]}); }; fr.onerror=function(){ rej(new Error('PDF ilizibil.')); }; fr.readAsDataURL(file); });
    }
    if(/\.(txt|md|csv|eml)$/.test(n)||/^text\//.test(file.type)){
      if(file.size>300*1024) return Promise.reject(new Error('Fisierul text "'+file.name+'" depaseste 300 KB.'));
      return new Promise(function(res,rej){ var fr=new FileReader(); fr.onload=function(){ res({name:file.name,kind:'text',text:String(fr.result)}); }; fr.onerror=function(){ rej(new Error('Fisier ilizibil.')); }; fr.readAsText(file); });
    }
    return Promise.reject(new Error('Tip neacceptat: "'+file.name+'". Accept imagini, PDF si text (.txt, .eml).'));
  }
  return {API:API,esc:esc,session:session,post:post,redact:redact,extract:extract,readFile:readFile};
})();

(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var LANG=(function(){ var l=''; try{ l=(localStorage.getItem('sbr_lang')||'').toUpperCase(); }catch(e){} return l==='EN'?'EN':'RO'; })();
document.documentElement.lang=LANG.toLowerCase();
var TXT={
 RO:{tag:'SBR Anti-Fraud \u00b7 Analist AI de risc',h1:'Intreaba orice despre frauda.',sub:'Descrie ce ti s-a intamplat sau ataseaza un mesaj, un e-mail sau o captura de ecran.',
   starters:['E o inselatorie mesajul asta?','Am primit un SMS suspect de la un curier','Cum recunosc phishing-ul?','Ce fac daca am dat deja click pe un link?','Explica-mi ce este frauda de tip CEO'],

   scoreLbl:'Scor de risc',confLbl:'Incredere in analiza',limitsLbl:'Limitele acestei analize',
   immediateLbl:'Imediat',verifyLbl:'Verifica',doLbl:'Fa',dontLbl:'Nu face',
   err_file:'Fisier neacceptat sau prea mare.',err_empty:'Scrie un mesaj sau ataseaza ceva mai intai.',
   changeLbl:'Ce a schimbat scorul',
   privacy:'Confidentialitate', gdpr:'GDPR'
 },
 EN:{tag:'SBR Anti-Fraud \u00b7 AI Risk Analyst',h1:'Ask anything about fraud.',sub:'Describe what happened to you, or attach a message, e-mail or screenshot.',
   starters:['Is this message a scam?','I got a suspicious text from a courier','How do I recognize phishing?','What do I do if I already clicked a link?','Explain CEO fraud to me'],
   placeholder:'Type a message or describe what happened...',send:'Send',attach:'Attach',thinking:'Analyzing...',
   wip:'work in progress',
   consent:'Content you send is analyzed automatically by SBR AI. Do not enter passwords or codes.',
   fallback:'The AI analysis is not available right now. Answering with the local engine, with limited features.',
   scoreLbl:'Risk score',confLbl:'Analysis confidence',limitsLbl:'Limits of this analysis',
   immediateLbl:'Immediately',verifyLbl:'Verify',doLbl:'Do',dontLbl:"Don't",
   err_file:'File not supported or too large.',err_empty:'Write a message or attach something first.',
   changeLbl:'What changed the score',
   privacy:'Privacy', gdpr:'GDPR'
 }
};
var T=TXT[LANG];
$('pg-tag').textContent=T.tag; $('pg-h1').textContent=T.h1; $('pg-sub').textContent=T.sub;
$('wip-badge').textContent='— '+T.wip;
$('in-text').placeholder=T.placeholder; $('consent-line').innerHTML=T.consent+' <a href="privacy.html">'+T.privacy+'</a> \u00b7 <a href="gdpr.html">'+T.gdpr+'</a>';
document.title = LANG==='EN' ? 'SBR AI \u2014 Ask anything about fraud' : 'SBR AI \u2014 Intreaba orice despre frauda';

function norm(t){ return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function snip(raw,i,len){ var s=Math.max(0,i-30),e=Math.min(raw.length,i+len+40); return (s>0?'...':'')+raw.slice(s,e).replace(/\s+/g,' ').trim()+(e<raw.length?'...':''); }
function host(u){ var m=/^(?:https?:\/\/)?([^\/\s:?#]+)/i.exec(u); return m?m[1].toLowerCase():''; }

/* ---------- local (demo) engine ---------- */
var A={sid:SBR.session(),round:0,answers:{},qtext:{},last:null,prevScore:null,busy:false,mode:'',pending:[]};
var thread=$('thread');

/* ---------- rendering helpers ---------- */
function scrollBottom(){ requestAnimationFrame(function(){ thread.scrollTop=thread.scrollHeight; }); }
function attChipsHtml(atts){
  if(!atts||!atts.length) return '';
  return '<div class="atts">'+atts.map(function(f){ return '<span class="att-chip">'+(f.preview?'<img alt="" src="'+f.preview+'">':'\uD83D\uDCCE')+' '+esc(f.name)+'</span>'; }).join('')+'</div>';
}
function pushMsg(role,html,extraCls){
  var d=document.createElement('div'); d.className='msg '+role+(extraCls?' '+extraCls:'');
  d.innerHTML=html; thread.appendChild(d); scrollBottom(); return d;
}
function pushTyping(){
  var d=pushMsg('b','<div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>');
  d.dataset.typing='1'; return d;
}

/* ---------- score band / gauge ---------- */
function bandOf(s){ if(s>=75) return {l:LANG==='EN'?'Critical risk':'Risc critic',c:'bad'}; if(s>=50) return {l:LANG==='EN'?'High risk':'Risc ridicat',c:'bad'}; if(s>=25) return {l:LANG==='EN'?'Moderate risk':'Risc moderat',c:'mid'}; return {l:LANG==='EN'?'Low risk':'Risc scazut',c:'ok'}; }
function gaugeSvg(score,cls){
  var col=cls==='ok'?'#27AE60':(cls==='mid'?'#E67E22':'#E74C3C'),r=34,C=2*Math.PI*r,off=C*(1-score/100);
  return '<svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="'+r+'" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="6"/><circle cx="38" cy="38" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 38 38)"/><text x="38" y="44" text-anchor="middle" fill="#fff" font-family="Bebas Neue,sans-serif" font-size="24">'+score+'</text></svg>';
}
function list(items){ return items&&items.length ? '<ul>'+items.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>' : ''; }

/* ---------- analysis card ---------- */
function cardHtml(r,round){
  var b=bandOf(r.score),h='<div class="acard">';
  h+='<div class="row1">'+gaugeSvg(r.score,b.c)+'<div><span class="band '+b.c+'">'+esc(b.l)+'</span><p class="expl">'+esc(r.explanation)+'</p></div></div>';
  if(round>1 && r.changeText){ h+='<div class="change">'+r.changeText+'</div>'; }
  if(r.typologies&&r.typologies.length){ h+='<h4>'+(LANG==='EN'?'Possible fraud type':'Tip posibil de frauda')+'</h4><ul>'+r.typologies.map(function(t){ return '<li><b>'+esc(t.name)+'</b> \u2014 '+esc(t.why)+'</li>'; }).join('')+'</ul>'; }
  if(r.signals&&r.signals.length){ h+='<h4>'+(LANG==='EN'?'Signals found':'Semnale gasite')+'</h4><ul>'+r.signals.slice(0,5).map(function(s){ return '<li>'+esc(s.title)+(s.evidence?'<span class="sigq">\u201c'+esc(s.evidence)+'\u201d</span>':'')+'</li>'; }).join('')+'</ul>'; }
  var p=r.plan||{};
  if((p.immediate&&p.immediate.length)||(p.verify&&p.verify.length)){
    h+='<div class="plan4">'+
     '<div><b>'+T.immediateLbl+'</b>'+list(p.immediate)+'</div>'+
     '<div><b>'+T.verifyLbl+'</b>'+list(p.verify)+'</div>'+
     '<div><b>'+T.doLbl+'</b>'+list(p.do)+'</div>'+
     '<div><b>'+T.dontLbl+'</b>'+list(p.dont)+'</div></div>';
  }
  if(r.questions&&r.questions.length){
    h+='<div class="qchips" data-qwrap="1">'+r.questions.slice(0,4).map(function(q){
      var opts=q.type==='choice'&&q.options&&q.options.length?q.options:['Da','Nu','Nu stiu'];
      if(LANG==='EN'&&q.type!=='choice') opts=['Yes','No',"Don't know"];
      return '<span style="display:block;width:100%;font-size:13px;color:#ccc;margin:8px 0 2px">'+esc(q.q)+'</span>'+
        opts.map(function(o){ return '<button type="button" data-qid="'+esc(q.id)+'" data-qval="'+esc(o)+'">'+esc(o)+'</button>'; }).join('');
    }).join('')+'</div>';
  }
  if(r.limits&&r.limits.length){ h+='<div class="limits">'+esc(T.limitsLbl)+': '+r.limits.join(' ')+'</div>'; }
  h+='</div>';
  return h;
}

/* ---------- detection: analyze vs ask ---------- */
function looksLikeCase(text,files){
  if(files&&files.length) return true;
  var t=text||'';
  if(t.length>=70) return true;
  if(/https?:\/\/|www\.[a-z]/i.test(t)) return true;
  if(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/.test(t)) return true;
  if(/\b(0|\+?40)[ .-]?7\d{2}/.test(t)) return true;
  return false;
}

/* ---------- backend calls ---------- */
function collectMat(text,files){
  var red=SBR.redact(text||''),ex=SBR.extract(text||'');
  return {text:red.text,links:ex.links,emails:ex.emails,phones:ex.phones,
    imgs:files.filter(function(f){return f.kind==='image';}).length, pdfs:files.filter(function(f){return f.kind==='pdf';}).length,
    files:files.map(function(f){ return {name:f.name,kind:f.kind,media_type:f.media_type,data:f.data}; })};
}
function arr(x){ return Array.isArray(x)?x:[]; }
function normAi(r){
  if(!r||typeof r.score!=='number') throw new Error('bad');
  var p=r.plan||{};
  return {score:Math.max(0,Math.min(100,Math.round(r.score))),confidence:r.confidence||'medie',
   typologies:arr(r.typologies).map(function(t){return {name:String(t.name||''),fit:t.fit,why:String(t.why||'')};}),
   signals:arr(r.signals).map(function(s){return {id:s.id,title:String(s.title||''),detail:String(s.detail||''),evidence:String(s.evidence||'')};}),
   limits:arr(r.limits).map(String), explanation:String(r.explanation||''), stage:r.stage||'necunoscut',
   questions:arr(r.questions).map(function(q,i){return {id:q.id||('q'+i),q:String(q.q||''),why:String(q.why||''),type:q.type||'yn',options:arr(q.options).map(String)};}).filter(function(q){return q.q;}),
   plan:{immediate:arr(p.immediate).map(String),verify:arr(p.verify).map(String),do:arr(p.do).map(String),dont:arr(p.dont).map(String),block:arr(p.block).map(String)},
   source:'ai'};
}
function runAnalyze(text,files){
  var mat=collectMat(text,files);
  var answers=Object.keys(A.answers).map(function(id){ return {id:id,q:(A.qtext[id]||id),a:A.answers[id]}; });
  var payload={action:'analyze',lang:LANG.toLowerCase(),session_id:A.sid,round:++A.round,channel:'',text:mat.text,links:mat.links,emails:mat.emails,phones:mat.phones,files:mat.files,answers:answers,
    previous:A.last?{score:A.last.score,typologies:A.last.typologies.map(function(t){return t.name;}),signals:A.last.signals.map(function(s){return s.title;})}:null};
  return SBR.post(SBR.API.ai,payload).then(function(r){ var n=normAi(r); n.fallback=false; return n; })
    .catch(function(){ var E=(LANG==='EN')?window.ENGINE_EN:window.ENGINE_RO; var r=E.localAnalyze(mat); r.fallback=true; return r; });
}
function runAsk(question){
  var ctx={score:A.last?A.last.score:null, typologies:A.last?A.last.typologies:[], signals:A.last?A.last.signals.map(function(s){return {title:s.title,evidence:s.evidence};}):[], stage:A.last?A.last.stage:null, lang:LANG.toLowerCase()};
  return SBR.post(SBR.API.ai,{action:'ask',lang:LANG.toLowerCase(),session_id:A.sid,question:question,context:ctx})
    .then(function(x){ if(!x||typeof x.answer!=='string') throw new Error('x'); return {text:x.answer,fallback:false}; })
    .catch(function(){ return {text:localFaq(question),fallback:true}; });
}

  var base=found.length?Math.round(100*(1-Math.exp(-sum/55))):(hasInput?10:0);
  if(found.length===0&&hasInput) base=10;
  base=Math.max(found.length?12:0,Math.min(97,base));
  // typologies
  var ts=TYP.map(function(t){ var s=0; found.forEach(function(f){ if(t.ids[f.id]) s+=f.weight*t.ids[f.id]; }); return {t:t,s:s}; }).filter(function(x){ return x.s>=7; }).sort(function(a,b){ return b.s-a.s; }).slice(0,3);
  var typs=ts.map(function(x){ var fit=x.s>=30?'mare':(x.s>=15?'medie':'mica'); var why=found.filter(function(f){ return x.t.ids[f.id]; }).map(function(f){ return f.title.toLowerCase(); }).slice(0,3).join(', '); return {name:x.t.n,fit:fit,why:'Similar signals: '+why+'.',_t:x.t}; });
  // answers
  var deltas=[],total=0;
  Object.keys(A.answers).forEach(function(id){ var a=A.answers[id],d=DELTA[id]&&DELTA[id][a]; if(d){ deltas.push({text:d[1],delta:d[0]}); total+=d[0]; } });
  var score=Math.max(0,Math.min(98,base+total)); if(hasInput&&score<5) score=5;
  var stage='necunoscut',an=A.answers;
  if(an.pay==='yes') stage='plata_efectuata'; else if(an.data==='yes') stage='date_furnizate'; else if(an.click==='yes'||an.app==='yes') stage='a_interactionat'; else if(an.click==='no'&&an.data!=='yes'&&an.pay!=='yes') stage='fara_actiune';
  var conf=found.length>=4?'ridicata':(found.length>=2?'medie':'scazuta');
  var tn=typs.map(function(x){ return x.name; }).join(' ');
  var qs=[Q_('click'),Q_('data'),Q_('pay'),Q_('verif'),Q_('who')];
  if(ids.rem||/suport tehnic/i.test(tn)) qs.push(Q_('app'));
  if(/marketplace/i.test(tn)) qs.push(Q_('recv'));
  if(/investitie/i.test(tn)) qs.push(Q_('ret'));
  if(/munca/i.test(tn)) qs.push(Q_('jobpay'));
  if(/autoritate/i.test(tn)||ids.sec) qs.push(Q_('secret'));
  if(/rude/i.test(tn)) qs.push(Q_('old'));
  qs=qs.filter(function(q){ return A.answers[q.id]===undefined; });
  var limits=['The analysis is based only on the text, links and addresses provided. I did not open the links and did not check the sender in real time.','A low score does not mean the message is safe, and a high score is not proof of fraud.','I cannot confirm the sender\'s identity and I do not offer legal conclusions.'];
  if(mat.imgs) limits.push('In demo mode, attached images are not analysed visually.');
  if(mat.pdfs) limits.push('In demo mode, PDF documents are not read.');
  var top=found.slice().sort(function(a,b){ return b.weight-a.weight; }).slice(0,3).map(function(f){ return f.title.toLowerCase(); });
  var expl=found.length?'The score of '+score+' comes from '+found.length+' signals found, mainly: '+top.join(', ')+'. It reflects how compatible the material is with known fraud patterns and how exposed you have been so far. It neither confirms nor rules out fraud.':'I did not find clear signals in the material provided. That does not mean it is safe: add more information or check the sender through an official channel.';
  return {score:score,base:base,confidence:conf,typologies:typs.map(function(x){ return {name:x.name,fit:x.fit,why:x.why}; }),signals:found,limits:limits,explanation:expl,stage:stage,questions:qs,deltas:deltas,plan:buildPlan(stage,ts.length?ts[0].t:null),source:'local',_typ:ts.length?ts[0].t:null};
}
function Q_(id){ var q=Q[id]; return {id:id,q:q.q,why:q.why,type:q.t,options:q.o||null}; }
function buildPlan(stage,t){
  var p={immediate:[],verify:[],do:[],dont:[],block:[]};
  if(stage==='plata_efectuata') p.immediate=['Call the bank immediately at the official number (on the card or in the app) and ask them to block or recover the transaction.','Keep the evidence: screenshots, conversations, the IBAN or the recipient account.','File a report with the Police and contact the bank in writing.'];
  else if(stage==='date_furnizate') p.immediate=['Change the affected passwords from another device and enable two-step authentication.','If you gave card details or codes, block the card in the banking app and notify the bank.','Check recent transactions in the banking app.'];
  else if(stage==='a_interactionat') p.immediate=['Close the page and do not enter any more data.','If you installed an app, uninstall it, disconnect the device from the internet and change your passwords from another device.','Run an antivirus scan.'];
  else p.immediate=['Do not reply and do not click until you check through an official channel.','Save the evidence (screenshots, addresses, numbers) before deleting the message.'];
  p.verify=['Look up the institution\'s number on its official website or on the back of your card, not in the message.','Type the official address in your browser yourself; do not use the link you received.','Check the real status in the official app (bank, courier, platform).'];
  if(t&&t.ver) p.verify=t.ver.concat(p.verify);
  p.do=['Save the evidence: screenshots, e-mail addresses, phone numbers, IBAN.','Report the message as spam or phishing in the app where you received it.','Warn people close to you if the message may reach them too.'];
  p.dont=['Do not click links and do not open attachments.','Do not enter passwords, codes or card details.','Do not call back the number in the message.','Do not install apps at the request of a stranger.','Do not pay fees or advances in order to "receive" money or parcels.','Do not keep the secrecy the sender asks for.'];
  p.block=['Block the sender\'s number or address, after saving the evidence.','Report and block the account on the platform where it appeared.','If you gave card details: block the card in the banking app.','If you gave passwords: change them and enable two-step authentication.'];
  return p;
}


window.ENGINE_EN={localAnalyze:localAnalyze,buildPlan:buildPlan,Q_:Q_};
})();

/* ---------- composer state ---------- */
var pendingFiles=[];
function renderPreview(){
  var el=$('att-preview');
  el.innerHTML=pendingFiles.map(function(f,i){ return '<span class="att-item">'+(f.preview?'<img alt="" src="'+f.preview+'">':'\uD83D\uDCCE')+' '+esc(f.name)+'<button type="button" data-rm="'+i+'" aria-label="Remove">&times;</button></span>'; }).join('');
}
$('att-preview').addEventListener('click',function(e){ var b=e.target.closest('[data-rm]'); if(b){ pendingFiles.splice(+b.dataset.rm,1); renderPreview(); } });
$('attach-btn').addEventListener('click',function(){ $('file-in').click(); });
$('file-in').addEventListener('change',function(e){
  var fs=Array.prototype.slice.call(e.target.files||[]);
  fs.forEach(function(f){
    if(pendingFiles.length>=4){ return; }
    SBR.readFile(f).then(function(x){ pendingFiles.push(x); renderPreview(); }).catch(function(err){ pushMsg('b','<div class="bubble">'+esc(T.err_file)+' ('+esc(err.message)+')</div>'); });
  });
  e.target.value='';
});
var ta=$('in-text');
ta.addEventListener('input',function(){ ta.style.height='auto'; ta.style.height=Math.min(120,ta.scrollHeight)+'px'; $('send-btn').disabled = !ta.value.trim() && !pendingFiles.length; });
ta.addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); trySend(); } });
$('send-btn').addEventListener('click',trySend);
$('send-btn').disabled=true;
setTimeout(function(){ afterReply(); },0);

var limitShown=false;
function lockInput(){
  ta.disabled=true; $('send-btn').disabled=true;
  var ab=$('attach-btn'); if(ab) ab.disabled=true;
  ta.placeholder=(LANG==='EN'?'Message limit reached':'Limita de mesaje atinsa');
  hideStarters();
}
function showLimit(st){
  lockInput();
  if(limitShown) return; limitShown=true;
  pushMsg('b',window.SBR_AILIMIT.ctaHtml(st,LANG));
}
function afterReply(){
  var L=window.SBR_AILIMIT; if(!L) return;
  L.check().then(function(st){ if(!st.allowed) showLimit(st); });
}

function trySend(){
  var text=ta.value.trim(), files=pendingFiles.slice();
  if(!text && !files.length) return;
  ta.value=''; ta.style.height='auto'; pendingFiles=[]; renderPreview(); $('send-btn').disabled=true;
  hideStarters();
  pushMsg('u','<div class="bubble">'+esc(text||(LANG==='EN'?'(attached files)':'(fisiere atasate)'))+'</div>'+attChipsHtml(files));
  handleSend(text,files);
}
function hideStarters(){ var s=$('starters'); if(s) s.style.display='none'; }

function handleSend(text,files){
  if(A.busy) return; A.busy=true;
  var L=window.SBR_AILIMIT;
  if(!L){ doSend(text,files); return; }
  L.check().then(function(st){
    if(!st.allowed){ A.busy=false; showLimit(st); return; }
    L.record(st);
    doSend(text,files);
  });
}
function doSend(text,files){
  var typ=pushTyping();
  var caseMode=looksLikeCase(text,files);
  var job = caseMode ? runAnalyze(text,files) : runAsk(text);
  job.then(function(res){
    typ.remove();
    if(caseMode){
      var prevScore=A.last?A.last.score:null;
      if(res.source==='local' && prevScore!==null && A.deltas){
        res.changeText=buildChangeHtml(A.deltas,prevScore,res.score);
      }
      A.prevScore=prevScore; A.last=res; A.mode='case';
      var card=cardHtml(res, A.round);
      if(res.fallback){ pushMsg('b','<div class="fallback-note">'+esc(T.fallback)+'</div>'+card); }
      else pushMsg('b',card);
    } else {
      if(res.fallback) pushMsg('b','<div class="fallback-note">'+esc(T.fallback)+'</div><div class="bubble">'+esc(res.text)+'</div>');
      else pushMsg('b','<div class="bubble">'+esc(res.text)+'</div>');
    }
    A.busy=false;
    afterReply();
  });
}
function buildChangeHtml(deltas,prev,now){
  if(!deltas||!deltas.length) return '';
  var dl=now-prev;
  return '<b>'+esc(T.changeLbl)+': '+prev+' \u2192 '+now+' ('+(dl>0?'+':'')+dl+')</b><ul>'+deltas.map(function(d){ return '<li><span class="'+(d.delta>0?'up':'down')+'">'+(d.delta>0?'+':'')+d.delta+'</span> '+esc(d.text)+'</li>'; }).join('')+'</ul>';
}

/* question-chip clicks inside analysis cards -> recalculate */
thread.addEventListener('click',function(e){
  var b=e.target.closest('[data-qid]'); if(!b) return;
  var qid=b.dataset.qid, val=b.dataset.qval;
  var norm = /^(da|yes)$/i.test(val)?'yes':(/^(nu|no)$/i.test(val)?'no':(/nu stiu|don.?t know/i.test(val)?'unk':val));
  A.answers[qid]=norm;
  if(A.last){ A.last.questions.forEach(function(q){ if(q.id===qid) A.qtext[qid]=q.q; }); }
  var wrap=b.closest('[data-qwrap]'); if(wrap) wrap.querySelectorAll('button').forEach(function(x){ x.disabled=true; x.style.opacity=.4; });
  b.style.opacity=1; b.style.borderColor='#C0392B'; b.disabled=false;
  var L=window.SBR_AILIMIT;
  function go(){
    var typ=pushTyping();
    runAnalyze(A.lastText||'', A.lastFiles||[]).then(function(res){
      typ.remove();
      var prevScore=A.last?A.last.score:null;
      if(res.source==='local'){ res.changeText=buildChangeHtml(res.deltas,prevScore,res.score); }
      A.prevScore=prevScore; A.last=res;
      var card=cardHtml(res,A.round);
      pushMsg('b',(res.fallback?'<div class="fallback-note">'+esc(T.fallback)+'</div>':'')+card);
      afterReply();
    });
  }
  if(!L){ go(); return; }
  L.check().then(function(st){
    if(!st.allowed){ showLimit(st); return; }
    L.record(st);
    go();
  });
});

/* starter chips */
$('starters').innerHTML=T.starters.map(function(s){ return '<button type="button" data-starter="'+esc(s)+'">'+esc(s)+'</button>'; }).join('');
$('starters').addEventListener('click',function(e){ var b=e.target.closest('[data-starter]'); if(!b) return; ta.value=b.dataset.starter; trySend(); });

/* keep last text/files for recalculation after chip answers */
var _origRunAnalyze=runAnalyze;
runAnalyze=function(text,files){ A.lastText=text; A.lastFiles=files; return _origRunAnalyze(text,files); };

document.addEventListener('sbr:lang:changed', function(e){ var nl=(e&&e.detail&&e.detail.lang)||''; if(!nl){ try{ nl=(localStorage.getItem('sbr_lang')||'').toUpperCase(); }catch(x){} } if(nl && nl!==LANG) location.reload(); });
window.addEventListener('storage', function(e){ if(e.key==='sbr_lang' && e.newValue && e.newValue.toUpperCase()!==LANG) location.reload(); });
})();
