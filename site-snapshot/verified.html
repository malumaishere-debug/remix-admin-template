<style>

}
:root[data-theme="dark"]{

*,*::before,*::after{box-sizing:inherit;}
body{margin:0;padding-top:58px;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-text-size-adjust:100%;}
a{color:var(--pine);}
.wrap{max-width:980px;margin:0 auto;padding:0 20px;}
.top{border-bottom:1px solid var(--line);background:var(--paper);}

h1{font:600 clamp(30px,5.2vw,50px)/1.1 var(--serif);margin:0 0 16px;letter-spacing:-.01em;}

input[type=text],input[type=number],input[type=date],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px;}
textarea{min-height:120px;resize:vertical;}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--pine);outline-offset:2px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.btn{font:600 15px/1 var(--sans);padding:13px 20px;border-radius:4px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;text-decoration:none;display:inline-block;}

.err{color:var(--brick);font-size:14px;margin-top:6px;}

.pill.ok{background:var(--pine-t);color:var(--pine);} .pill.mid{background:var(--amber-t);color:var(--amber);} .pill.bad{background:var(--brick-t);color:var(--brick);}
.pill.neutral{background:var(--panel);color:var(--soft);border:1px solid var(--line);}

.scroll{overflow-x:auto;max-width:100%;}

.js .rv{opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s ease;}
.js .rv.in{opacity:1;transform:none;}

.band .wrap{position:relative;z-index:1;}
.band a{color:#5BD0B2;} .band .lede{color:#B4C2CB;} .band .note{color:#8FA3AF;}
.band .eyebrow{color:#5BD0B2;} .band h1{color:#F3F7F5;}
.band .btn{background:#F3F7F5;color:#0B1622;border-color:#F3F7F5;} .band .btn.pine{background:#2AA58A;border-color:#2AA58A;color:#fff;} .band .btn.sec{background:transparent;color:#F3F7F5;border-color:#5B7382;}

.sec2{padding:70px 0 6px;} .sec2 + .sec2{border-top:1px solid var(--line);margin-top:56px;}
.kicker{font-weight:600;font-size:14px;color:var(--pine);margin:0 0 10px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:26px;border-top:1px solid var(--line);border-left:1px solid var(--line);}

.tile .no{font:600 14px var(--sans);color:var(--pine);} .tile h3{margin:4px 0 6px;font-size:18px;} .tile p{margin:0;color:var(--soft);font-size:15px;} .tile .w{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;color:var(--soft);border:1px solid var(--line);border-radius:99px;padding:2px 10px;}
.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:26px;}
.ladder div{position:relative;padding:22px 22px 24px;border:1px solid var(--line);background:var(--panel);}

.mock-h b{font:600 17px var(--serif);}
.mock-b{display:grid;grid-template-columns:190px 1fr;gap:28px;padding:22px 20px;align-items:center;}
.mock-b svg{width:100%;height:auto;} .mb{display:grid;grid-template-columns:150px 1fr 34px;gap:10px;align-items:center;padding:5px 0;font-size:14px;}
.mb i{display:block;height:9px;background:var(--line);border-radius:2px;overflow:hidden;} .mb i em{display:block;height:100%;} .mb .ok{background:var(--pine);} .mb .mid{background:var(--amber);} .mb .bad{background:var(--brick);} .mb strong{text-align:right;font-variant-numeric:tabular-nums;}
.mock-n{padding:0 20px 20px;color:var(--soft);font-size:15px;max-width:74ch;}
.chipsrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;} .chipsrow span{border:1px solid var(--line);border-radius:99px;padding:6px 14px;background:var(--panel);font-size:14px;font-weight:500;}
.faq details{border-top:1px solid var(--line);padding:16px 0;} .faq details:last-child{border-bottom:1px solid var(--line);}
.faq summary{cursor:pointer;font:600 18px/1.35 var(--serif);list-style:none;display:flex;justify-content:space-between;gap:16px;} .faq summary::-webkit-details-marker{display:none;}
.faq summary::after{content:"+";font:400 26px/1 var(--sans);color:var(--pine);} .faq details[open] summary::after{content:"\2212";}
.faq p{margin:10px 0 0;color:var(--soft);max-width:70ch;}
.ctaband{background:var(--ink);color:var(--paper);padding:52px 0;margin-top:70px;text-align:left;}
.ctaband h2{color:var(--paper);margin:0 0 8px;} .ctaband p{margin:0 0 18px;opacity:.85;max-width:60ch;}
.ctaband .btn{background:var(--paper);color:var(--ink);border-color:var(--paper);}
@media (max-width:820px){.hero-grid{grid-template-columns:1fr;padding:42px 0 40px;} .art{max-width:300px;} .facts .wrap{grid-template-columns:repeat(2,1fr);} .facts div:nth-child(2){border-right:0;} .facts div{border-bottom:1px solid var(--line);} .grid3,.ladder{grid-template-columns:1fr;} .mock-b{grid-template-columns:1fr;justify-items:center;} .mb{grid-template-columns:110px 1fr 30px;}}
@media print{.band,.facts,.sec2,.ctaband{display:none !important;}}

.top nav a.lang{border:1px solid var(--line);border-radius:4px;padding:1px 9px;font-size:13px;font-weight:600;color:var(--ink);}

.hero{padding:56px 0 34px;}
.eyebrow{font-weight:600;font-size:14px;color:var(--pine);margin:0 0 12px;}

.route{list-style:none;margin:26px 0 0;padding:0;position:relative;}

<div id="root"></div>
<template id="tpl-ro">
<section class="band explain">
 <div class="wrap hero-grid">

<section class="sec2 rv" aria-labelledby="why">
  <p class="kicker">De ce SBR Verified</p>
  <h2 id="why">Reputatia spune ce s-a intamplat. Standardul arata cum functioneaza firma azi.</h2>
  <p style="max-width:66ch;font-size:17px">In afaceri, increderea se construieste greu si se pierde repede. Partenerii, bancile si clientii mari se bazeaza pe reputatie, pe recomandari si pe documente pe care nu au cum sa le verifice singuri.</p>
  <p style="max-width:66ch;font-size:17px">Reputatia nu spune cat de bine este organizata firma astazi: cine aproba platile, cum sunt alesi furnizorii, ce ramane in urma fiecarei operatiuni, cat depinde totul de o singura persoana sau de un intermediar. SBR Verified raspunde exact acestei intrebari: firma isi prezinta procesele si dovezile, iar evaluarea le transforma intr-un scor de risc, un plan de imbunatatire si un raport care poate fi aratat mai departe.</p>
  <div class="grid3"><div class="tile"><span class="no">01</span><h3>Structurat</h3><p>Aceleasi criterii, aplicate coerent si adaptate domeniului de activitate.</p></div><div class="tile"><span class="no">02</span><h3>Dovedit</h3><p>Fiecare afirmatie poate fi sustinuta cu documente, capturi si fotografii, iar AI-ul le compara cu ce s-a declarat.</p></div><div class="tile"><span class="no">03</span><h3>Verificat</h3><p>Un evaluator uman SBR valideaza dosarul inainte de orice marca de incredere.</p></div></div>
</section>

  <div class="grid3">
   <div class="tile"><span class="no">Documentare</span><h3>Exista si este actual?</h3><p>Procedura scrisa, pasi clari, responsabili numiti, exceptii tratate.</p><span class="w">pondere 12%</span></div>
   <div class="tile"><span class="no">Control intern</span><h3>Cineva verifica?</h3><p>Aprobari, reconcilieri si verificari periodice care functioneaza cu adevarat.</p><span class="w">pondere 18%</span></div>
   <div class="tile"><span class="no">Separarea atributiilor</span><h3>Cine face ce?</h3><p>Cel care aproba nu este cel care executa, iar cel care executa nu este cel care verifica.</p><span class="w">pondere 18%</span></div>
   <div class="tile"><span class="no">Trasabilitate</span><h3>Ce ramane in urma?</h3><p>Jurnale, semnaturi si evidente din care se poate reconstitui orice operatiune.</p><span class="w">pondere 14%</span></div>

  <p class="lede" style="margin-bottom:0">Fiecare statie are un rezultat clar. Este o evaluare care se construieste pe masura ce firma isi arata procesele, nu un chestionar.</p>
  <ol class="route">
    <li><span class="n">1</span><h3>Profil</h3><p>Spui cine esti: firma, CUI, dimensiune. Acesta este cadrul evaluarii.</p><span class="res">Rezultat: identitatea evaluarii</span></li>
    <li><span class="n">2</span><h3>Domeniu</h3><p>Alegi domeniul de activitate. Criteriile se adapteaza riscurilor specifice: un magazin online nu are aceleasi expuneri ca o firma de constructii.</p><span class="res">Rezultat: setul de procese relevante</span></li>
    <li><span class="n">3</span><h3>Procese</h3><p>Descrii cum functioneaza procesele-cheie: plati, achizitii, acces la date si procesele specifice domeniului.</p><span class="res">Rezultat: harta proceselor</span></li>
    <li><span class="n">4</span><h3>Dovezi</h3><p>Sustii ce ai declarat: proceduri (SOP), capturi de ecran din aplicatii, fotografii ale registrelor, contracte, e-mailuri de aprobare.</p><span class="res">Rezultat: dosarul de dovezi</span></li>
    <li><span class="n">5</span><h3>Scor si recomandari</h3><p>Analiza AI citeste dovezile, le compara cu ce ai declarat, pune intrebari acolo unde exista lacune si calculeaza scorul. Poti raspunde, iar scorul se recalculeaza si iti explica ce s-a schimbat.</p><span class="res">Rezultat: scor pe proces si pe companie, plan prioritizat</span></li>
    <li><span class="n">6</span><h3>Verificare</h3><p>Un evaluator uman SBR analizeaza dosarul, discuta cu responsabilii proceselor si valideaza rezultatele.</p><span class="res">Rezultat: nivelul Validat</span></li>
    <li><span class="n">7</span><h3>Raport</h3><p>Un raport lizibil: povestea evaluarii, explicatia, rezultatul, dovezile si recomandarile.</p><span class="res">Rezultat: documentul pe care il poti arata partenerilor</span></li>

<section class="sec2 rv faq" aria-labelledby="faq-h">
  <p class="kicker">Intrebari frecvente</p>
  <h2 id="faq-h" style="margin-bottom:18px">Ce merita stiut inainte sa incepi</h2>
  <details><summary>Este un audit sau o certificare?</summary><p>Nu. SBR Verified este o evaluare structurata, bazata pe informatiile si dovezile pe care le prezinti. Nu inlocuieste un audit financiar sau o certificare acreditata si nu garanteaza absenta fraudei. Limitele sunt scrise in fiecare raport.</p></details>
  <details><summary>Ce se intampla cu documentele si imaginile incarcate?</summary><p>Sunt trimise spre analiza automata si nu sunt pastrate ca fisiere. Se inregistreaza textul (fara numere de card si CNP) si rezultatele analizei, conform politicii de confidentialitate si acordului pe care il bifezi la inceput.</p></details>
  <details><summary>Cine verifica dosarul?</summary><p>La nivelul Validat, un evaluator uman SBR analizeaza dosarul, discuta cu responsabilii proceselor si valideaza rezultatele.</p></details>
  <details><summary>Pot opri si continua mai tarziu?</summary><p>Da. Raspunsurile si textele se salveaza in browserul tau. Fisierele incarcate trebuie adaugate din nou daca inchizi pagina.</p></details>
  <details><summary>Ce inseamna scorul?</summary><p>Scorul merge de la 0 la 100; mai mare inseamna risc operational mai mic. Regulile de plafonare fac ca un punct critic, de exemplu aceeasi persoana care aproba si executa plati, sa nu poata fi compensat de alte bune practici.</p></details>
  <details><summary>Care sunt conditiile comerciale?</summary><p>Vor fi comunicate inainte de lansarea publica. In aceasta etapa, evaluarea este un pilot.</p></details>
</section>

<section class="sec2 rv" aria-labelledby="why">
  <p class="kicker">Why SBR Verified</p>
  <h2 id="why">Reputation says what has happened. The standard shows how the company works today.</h2>
  <p style="max-width:66ch;font-size:17px">In business, trust is built slowly and lost quickly. Partners, banks and large customers rely on reputation, recommendations and documents they cannot verify themselves.</p>
  <p style="max-width:66ch;font-size:17px">Reputation does not say how well organised the company is today: who approves payments, how suppliers are chosen, what is left behind by each operation, how much depends on a single person or an intermediary. SBR Verified answers exactly this question: the company presents its processes and evidence, and the assessment turns them into a risk score, an improvement plan and a report that can be shown to others.</p>
  <div class="grid3"><div class="tile"><span class="no">01</span><h3>Structured</h3><p>The same criteria, applied consistently and adapted to the field of activity.</p></div><div class="tile"><span class="no">02</span><h3>Evidenced</h3><p>Every claim can be supported with documents, screenshots and photos, and the AI compares them with what was declared.</p></div><div class="tile"><span class="no">03</span><h3>Verified</h3><p>A human SBR evaluator validates the file before any trust mark.</p></div></div>

<section class="sec2 rv" aria-labelledby="dim-h">

   <div class="tile"><span class="no">Segregation of duties</span><h3>Who does what?</h3><p>The one who approves is not the one who executes, and the one who executes is not the one who checks.</p><span class="w">weight 18%</span></div>
   <div class="tile"><span class="no">Traceability</span><h3>What is left behind?</h3><p>Logs, signatures and records from which any operation can be reconstructed.</p><span class="w">weight 14%</span></div>
   <div class="tile"><span class="no">Fraud exposure</span><h3>How easy is it to exploit?</h3><p>Concrete weak points of the process, against real fraud patterns.</p><span class="w">weight 18%</span></div>

function analyse(text){
  var t=(text||'').toLowerCase(),trimmed=(text||'').trim();
  var words=trimmed?trimmed.split(/\s+/).length:0,hit=[],miss=[];
  KW.forEach(function(p){ (new RegExp(p[0])).test(t)?hit.push(p[1]):miss.push(p[1]); });
  return {words:words,hit:hit,miss:miss};
}

function auditProblems(){
  var A=S.audit,p=[];

    var d=new Date(A.date+'T12:00:00'),tm=new Date(); tm.setHours(0,0,0,0); tm.setDate(tm.getDate()+1);
    if(isNaN(d)||d<tm) p.push('o data de maine sau ulterioara'); else if(d.getDay()===0||d.getDay()===6) p.push('o zi lucratoare (luni–vineri)');

  if(!A.mode) p.push('modalitatea (online sau la sediu)');
  if(!A.name.trim()) p.push('numele persoanei de contact');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(A.email.trim())) p.push('o adresa de e-mail valida');

function reqText(){

  R.procs.forEach(function(p){ L.push('- '+p.name+': '+p.score+(p.caps.length?' (plafonat)':'')); });

  SLOTS.forEach(function(o){ h+='<option'+(A.slot===o?' selected':'')+'>'+o+'</option>'; });
  h+='</select></div></div><div class="field"><span class="lab">Format</span><div class="opts" style="grid-template-columns:repeat(2,1fr);max-width:420px">';
  ['Online','On the company\'s premises'].forEach(function(o){ h+='<label class="opt"><input type="radio" name="a-mode" value="'+o+'"'+(A.mode===o?' checked':'')+'><span>'+o+'</span></label>'; });
  h+='</div></div><div class="row2"><div class="field"><label for="a-name">Contact person</label><input type="text" id="a-name" autocomplete="name" value="'+esc(A.name)+'"></div><div class="field"><label for="a-email">E-mail</label><input type="text" id="a-email" inputmode="email" autocomplete="email" value="'+esc(A.email)+'"></div></div>';
  h+='<div class="field" style="max-width:420px"><label for="a-phone">Phone <span class="hint">Optional</span></label><input type="text" id="a-phone" inputmode="tel" autocomplete="tel" value="'+esc(A.phone)+'"></div>';
  h+='<div class="field"><label style="font-weight:400"><input type="checkbox" id="a-consent"'+(A.consent?' checked':'')+'> I agree that the data in this request and the assessment summary may be sent to the SBR verifier to schedule the verification.</label></div>';
  h+='<h3>Request summary</h3><div class="field"><label for="req-out" class="note">This text goes to the verifier</label><textarea id="req-out" readonly></textarea></div><div id="audit-actions" class="actions"></div><p class="note" id="audit-note"></p>';
  return h+navRow('Back to score','Continue to report',true,'');
}
function refreshAudit(){
  var out=$('req-out'),box=$('audit-actions'),nt=$('audit-note'); if(!out||!box) return;
  var pr=auditProblems(),txt=reqText(); out.value=txt;
  if(pr.length){ box.innerHTML='<button type="button" class="btn" disabled>Send the request to the verifier</button>'; nt.textContent='Still to be completed: '+pr.join(', ')+'.'; return; }
  var hh='<button type="button" class="btn pine" data-act="sendreq">Send the request to the verifier</button><button type="button" class="btn sec" data-act="copyreq">Copy the request</button>';
  if(VERIFIER.email) hh+='<a class="btn sec" href="mailto:'+encodeURIComponent(VERIFIER.email).replace('%40','@')+'?subject='+encodeURIComponent('SBR Verified verification request: '+S.profile.name)+'&body='+encodeURIComponent(txt)+'">Send by e-mail</a>';
  if(VERIFIER.telegram) hh+='<a class="btn sec" href="'+esc(VERIFIER.telegram)+'" target="_blank" rel="noopener">Open SBR Telegram</a>';
  box.innerHTML=hh;
  nt.innerHTML=(S.sent==='ok'?'<span class="ok-t">The request has been recorded. The verifier will confirm the appointment with a reply.</span>':(S.sent==='fail'?'<span class="err">The request could not be sent automatically. Copy it and send it by Telegram or e-mail.</span>':'The appointment is confirmed by the verifier with a reply.'))+'<br><span class="ok-t" id="copied"></span>';
}
function sendReq(){ S.sent='pending'; var n=$('audit-note'); if(n) n.innerHTML='<span class="spin"></span>Sending...'; saveRemote('audit_request').then(function(ok){ S.sent=ok?'ok':'fail'; refreshAudit(); }); }
function copyReq(){
  var ta=$('req-out'),m=$('copied'); if(!ta) return;
  function ok(){ if(m) m.textContent='The request was copied.'; }
  function fb(){ ta.focus(); ta.select(); var d=false; try{ d=document.execCommand('copy'); }catch(e){} if(d) ok(); else if(m) m.textContent='The text is selected. Copy it manually.'; }
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(ok,fb); else fb();
}
function narrative(R){
  var b=band(R.company),so=R.procs.slice().sort(function(x,y){ return y.score-x.score; }),best=so[0],worst=so[so.length-1],capped=R.procs.filter(function(p){ return p.caps.length; }),nev=R.procs.filter(function(p){ return p.evidence; }).length,red=0;
  R.procs.forEach(function(p){ red+=p.reduced.length; });
  var t=[];
  t.push(S.profile.name+' is a company in the field "'+NICHES[S.niche].n+'"'+(S.profile.emp?', with '+S.profile.emp+' employees,':'')+' that went through the SBR Verified route on '+R.procs.length+' processes: '+R.procs.map(function(p){ return p.name; }).join(', ')+'.');
  t.push('The company score is '+R.company+' out of 100 ('+b.label.toLowerCase()+'). The strongest process is "'+best.name+'" ('+best.score+'), and the most exposed is "'+worst.name+'" ('+worst.score+').');
  if(capped.length) t.push('For '+capped.map(function(p){ return '"'+p.name+'"'; }).join(', ')+' the score is capped: the same person can approve, execute and control the relationship with a third party, which is the most important point to correct, regardless of the other controls.');
  t.push('Evidence was provided for '+nev+' of '+R.procs.length+' processes.'+(red?' The evidence analysis reduced '+red+' declared assessments, because the evidence did not confirm them.':' The evidence analysis did not reduce any declared assessment.'));
  t.push(R.elig?'The company meets the conditions for moving to the "Validated" level, through verification by a human SBR evaluator.':'To be eligible for the SBR Verified mark, the company still has to resolve: '+R.blockers.map(function(x){ return x.replace(/\.$/,'').toLowerCase(); }).join('; ')+'.');
  return t;
}
function v6(){
  var R=compute(),b=band(R.company),now=new Date().toLocaleDateString(SBR.loc),h='<div class="story-rep">';
  h+='<p class="eyebrow" style="margin:0 0 8px">SBR Verified report</p><p class="firm">'+esc(S.profile.name)+'</p><p class="meta">'+(S.profile.cui?'Tax ID (CUI) '+esc(S.profile.cui)+' · ':'')+esc(NICHES[S.niche].n)+' · Assessment dated '+now+'</p>';
  h+='<div class="verdict"><div>'+seal(R.company)+'</div><div><p><span class="pill '+b.cls+'">'+b.label+'</span><span class="pill neutral">Trust level: '+R.level+'</span><span class="pill neutral">Human verification: '+(S.sent==='ok'?'appointment requested':'pending')+'</span></p><p class="meta" style="margin:0">Score from 0 to 100; higher means lower operational risk.</p></div></div>';
  h+='<h3>The story of the assessment</h3>'+narrative(R).map(function(x){ return '<p>'+esc(x)+'</p>'; }).join('');
  h+=(R.elig?'<div class="box ok"><b>Eligible for the SBR Verified assessment</b>The score, process and evidence conditions are met.</div>':'<div class="box mid"><b>Not yet eligible for the SBR Verified mark</b>'+ul(R.blockers)+'</div>');
  if(R.notes.length) h+='<div class="box"><b>Adjustments applied to the company score</b>'+ul(R.notes)+'</div>';
  h+='<h3>Result by process</h3>'+bars(R);
  h+='<h3>Map of dimensions</h3><p class="note">The score of each dimension, for each process (0-100).</p><div class="scroll"><table class="heat"><thead><tr><th>Process</th>'+DIMS.map(function(d){ return '<th>'+d.short+'</th>'; }).join('')+'</tr></thead><tbody>';
  R.procs.forEach(function(p){ h+='<tr><td>'+esc(p.name)+'</td>'+DIMS.map(function(d){ var v=Math.round(p.d[d.id]); return '<td class="c '+band(v).cls+'">'+v+'</td>'; }).join('')+'</tr>'; });
  h+='</tbody></table></div><h3>Evidence and analysis</h3>';
  R.procs.forEach(function(p){ var e=evOf(p.id),it=[]; if(e.summary) it.push(e.summary); p.reduced.forEach(function(x){ it.push('Assessment reduced after evidence: '+x.t); }); e.gaps.forEach(function(x){ it.push('Gap: '+x); }); h+='<div class="pc"><b>'+esc(p.name)+'</b><div class="meta">'+esc(evStatus(p.id))+'</div>'+(it.length?ul(it):'')+'<div class="meta">Related requirements (to be checked with a specialist): '+esc(PROCS[p.id].req)+'</div></div>'; });
  h+='<h3>Recommendations, in order of impact</h3>';
  if(R.plan.length){ h+='<ol class="plan">'; R.plan.forEach(function(x,i){ h+='<li><b>'+esc(x.pn)+'</b>'+esc(x.f)+'<div class="meta">Dimension: '+esc(x.dim)+'. Current situation: '+esc(x.cur)+'. Recommended timeframe: '+(i<3?'immediately, within 30 days':(i<7?'within 1-3 months':'within 3-6 months'))+'.</div></li>'; }); h+='</ol>'; } else h+='<p>All levels are at maximum.</p>';
  h+='<h3>Methodology</h3><div class="method"><p>Each process is assessed on six dimensions: '+DIMS.map(function(d){ return d.name.split(',')[0]+' '+d.w+'%'; }).join(', ')+'. The dependence dimension has three sub-scores: internal key people 30%, external third parties 30%, intermediaries and hidden relationships 40%. Declared levels are compared with the evidence, and the assessment is reduced when the evidence does not support it.</p><p>Capping rules: a process score cannot exceed 40 if the same person can approve, execute and control the relationship with a third party, and cannot exceed 50 if the process has neither a procedure nor controls. The company score is the weighted average of the processes, with a penalty for concentrating dependence on key people.</p><p>Trust levels: “Declared”, “Documented” (evidence for all processes) and “Validated” (verification by an SBR evaluator and cross-checking with public sources).</p><p><b>Limits.</b> The assessment is based on the information and evidence provided by the company. It is not an audit, certification or guarantee and does not prove the absence of fraud. Risk indicators point to structures that allow abuse; they do not accuse people.</p></div></div>';
  h+='<div class="actions noprint"><button type="button" class="btn" data-act="print">Print the report</button><button type="button" class="btn sec" data-act="edit">Edit the answers</button><button type="button" class="btn sec" data-act="reset">Start over</button></div>';
  return h;
}
function render(scroll){
  var rail='';
  STN.forEach(function(l,i){ var cls=(i===S.st?'on':(i<S.st?'done':'')); rail+='<li class="'+cls+'"><button type="button" data-act="go" data-i="'+i+'"'+(i>S.max?' disabled':'')+(i===S.st?' aria-current="step"':'')+'><span class="dot">'+(i<S.st?'&#10003;':(i+1))+'</span>'+esc(l)+'</button></li>'; });
  $('rail').innerHTML=rail;
  var fn=[v0,v1,v2,v3,v4,viewAudit,v6][S.st]; $('stage').innerHTML=fn();
  if(S.st===5) refreshAudit();
  if(scroll){ var t=$('traseu'); if(t&&t.scrollIntoView) t.scrollIntoView({block:'start'}); }
}
function updateNext(){
  var btn=$('btn-next'),pg=$('prog'); if(!btn) return;
  if(S.st===0){ var ok=profileOk(); btn.disabled=!ok; pg.textContent=ok?'':'Fill in the company name and tick the consent.'; }
  else if(S.st===1){ btn.disabled=!S.niche; }
  else if(S.st===2){ var pid=procs()[S.pt],c=answeredCount(pid),n=buildQs(pid).length; btn.disabled=(c!==n); pg.textContent=c+' of '+n+' answers completed'; }
}
function go(n,scroll){ S.st=n; S.max=Math.max(S.max,n); save(); render(scroll!==false); }

/* ---------- events ---------- */
var stage=$('stage');
stage.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='f-name') S.profile.name=t.value;
  else if(t.id==='f-cui') S.profile.cui=t.value;
  else if(t.id==='f-human'){ S.profile.human=t.value; var er=$('e-human'); if(er) er.hidden=!isNaN(humanVal()); }
  else if(t.id==='f-note'){ evOf(t.dataset.p).text=t.value; var s=$('evst'); if(s) s.textContent=evStatus(t.dataset.p)+' Card numbers and personal ID numbers in the text are removed automatically.'; }
  else if(t.dataset&&t.dataset.fq){ evOf(t.dataset.fq).fq[+t.dataset.i].a=t.value; }
  else if(t.id==='a-name'||t.id==='a-email'||t.id==='a-phone'){ var mp={'a-name':'name','a-email':'email','a-phone':'phone'}; S.audit[mp[t.id]]=t.value; S.sent=''; save(); refreshAudit(); return; }
  else return;
  save(); updateNext();
});
stage.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='f-emp'){ S.profile.emp=t.value; save(); return; }
  if(t.id==='f-consent'){ S.profile.consent=t.checked; save(); updateNext(); return; }
  if(t.name==='niche'){ if(S.niche!==t.value){ S.niche=t.value; S.ans={}; S.ev={}; S.analyzed=false; S.pt=0; S.et=0; S.round=0; S.max=Math.min(S.max,1); } save(); updateNext(); return; }
  if(t.id==='a-date'){ S.audit.date=t.value; S.sent=''; save(); refreshAudit(); return; }
  if(t.id==='a-slot'){ S.audit.slot=t.value; S.sent=''; save(); refreshAudit(); return; }
  if(t.name==='a-mode'){ S.audit.mode=t.value; S.sent=''; save(); refreshAudit(); return; }
  if(t.id==='a-consent'){ S.audit.consent=t.checked; S.sent=''; save(); refreshAudit(); return; }
  if(t.dataset&&t.dataset.k){ var p=t.dataset.p; S.ans[p]=S.ans[p]||{}; S.ans[p][t.dataset.k]=Number(t.value); S.analyzed=S.analyzed; save(); updateNext(); return; }
  if(t.id==='f-files'){ addFiles(t); }
});
function addFiles(inp){
  var pid=inp.dataset.p,e=evOf(pid),er=$('ferr'),fs=Array.prototype.slice.call(inp.files||[]); er.hidden=true;
  fs.forEach(function(f){
    var imgs=e.files.filter(function(x){ return x.kind==='image'; }).length,docs=e.files.filter(function(x){ return x.kind!=='image'; }).length,isImg=/^image\//.test(f.type);
    if(isImg&&imgs>=4){ er.textContent='Maximum 4 images per process.'; er.hidden=false; return; }
    if(!isImg&&docs>=2){ er.textContent='Maximum 2 documents per process.'; er.hidden=false; return; }
    SBR.readFile(f).then(function(x){ e.files.push(x); $('flist').innerHTML=filesHtml(pid); var s=$('evst'); if(s) s.textContent=evStatus(pid); }).catch(function(x){ er.textContent=x.message; er.hidden=false; });
  });
  inp.value='';
}
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]'); if(!b||b.disabled) return;
  var act=b.dataset.act,st=S.st;
  if(act==='next'){ go(st+1); }
  else if(act==='back'){ if(st===2&&S.pt>0){ S.pt--; render(true); } else if(st===3&&S.et>0){ S.et--; render(true); } else if(st>0) go(st-1); }
  else if(act==='nextp'){ S.pt++; save(); render(true); }
  else if(act==='nexte'){ S.et++; save(); render(true); }
  else if(act==='tabp'){ S.pt=+b.dataset.i; render(false); }
  else if(act==='tabe'){ S.et=+b.dataset.i; render(false); }
  else if(act==='go'){ var i=+b.dataset.i; if(i<=S.max) go(i); }
  else if(act==='rmf'){ evOf(b.dataset.p).files.splice(+b.dataset.i,1); $('flist').innerHTML=filesHtml(b.dataset.p); var s=$('evst'); if(s) s.textContent=evStatus(b.dataset.p); }
  else if(act==='run'){ if(!allAnswered()){ return; } runAnalysis(); var bt=$('btn-next'); if(bt){ bt.disabled=true; bt.textContent='Analysing...'; } }
  else if(act==='sendreq'){ sendReq(); }
  else if(act==='copyreq'){ copyReq(); }
  else if(act==='print'){ try{ window.print(); }catch(e){} }
  else if(act==='edit'){ S.pt=0; go(2); }
  else if(act==='reset'){ S=Object.assign(S,{niche:null,profile:{name:'',cui:'',emp:'',human:'',consent:false},ans:{},ev:{},st:0,max:0,pt:0,et:0,round:0,analyzed:false,mode:'',busy:false,log:[],prevScore:null,changes:[],audit:newAudit(),sent:''}); try{ localStorage.removeItem(KEY); }catch(e){} render(true); }
});
SBR.init();
load();
if(S.st>6||(S.st>0&&!S.niche)) S.st=0;
render(false);
})();

}
(function(){
  var TT={ro:"SBR Verified: evaluarea proceselor firmei",en:"SBR Verified: assessment of a company's processes"},DD={ro:"SBR Verified: traseu de audit digital pentru firme, de la profil si procese la dovezi, scor, verificare si raport.",en:"SBR Verified: a digital audit route for companies, from profile and processes to evidence, score, verification and report."};
  var tpl=document.getElementById('tpl-'+SBR_LANG);
  document.getElementById('root').appendChild(tpl.content.cloneNode(true));
  document.documentElement.lang=SBR_LANG; document.title=TT[SBR_LANG];
  var md=document.querySelector('meta[name=description]'); if(md) md.setAttribute('content',DD[SBR_LANG]);
  (SBR_LANG==='en'?runEN:runRO)();
})();
</script>
